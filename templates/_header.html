<!-- The same header on every page (included; static/common.js fills the account area): the site's
     name (the home page, user 2026-10-15), the search (on /browse its script runs it, elsewhere it opens
     /browse?q=…), the account's links, language and theme. On a phone the search takes a row of its own.
     home: /browse (the tabs under the header); landing: the home page (the name is its h1) -->
<header class="site-header bg-body border-bottom{% if not (home or landing) %} mb-4{% endif %}">
    <div class="container-xxl header-row">
        {% if landing %}<h1 class="site-brand m-0">{% endif %}<a href="/" class="site-brand-link"
            ><span class="brand-a">SaveOn</span><span class="brand-b">Games</span></a>{% if landing %}</h1>{% endif %}
        <form class="header-search" id="search-form" action="/browse" method="get" role="search">
            <input type="search" id="q" name="q" class="form-control" autocomplete="off"
                   data-i18n-placeholder="search_placeholder" data-i18n-aria-label="search">
        </form>
        <div class="header-tools d-flex align-items-center gap-1">
            <div id="account-area" class="d-flex gap-1 align-items-center"></div>
            <div id="lang-switch" class="btn-group header-setting" role="group" data-i18n-aria-label="language"></div>
            <button type="button" data-toggle-dark class="btn btn-sm btn-secondary header-setting"
                    data-i18n-aria-label="dark_mode" data-i18n-title="dark_mode"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                    focusable="false" class="svg-icon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
        </div>
    </div>
</header>
