<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SaveGame</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- installable on a phone (static/manifest.webmanifest, static/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2346d0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="/static/common.css" rel="stylesheet">
    <script src="/static/common.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/market.js"></script>
</head>
<body class="bg-body-tertiary" data-username="{{ username }}">

{% include "_header.html" %}

<!-- The user's collection beside another user's (follow_service.compare; user, 2026-10-12) -->
<div class="container pb-4" style="max-width: 1000px;">
    <div id="loading" class="text-center my-5"><div class="spinner-border text-primary"></div></div>
    <div id="error" class="alert alert-warning d-none"></div>

    <div id="compare" class="d-none">
        <h1 id="title" class="h4 mb-3"></h1>
        <!-- the two collections in numbers -->
        <div class="table-responsive mb-3">
            <table class="table table-sm align-middle mb-0">
                <thead><tr><th></th><th id="head-me" class="text-end"></th><th id="head-them" class="text-end"></th></tr></thead>
                <tbody id="summary"></tbody>
            </table>
        </div>
        <div id="tabs" class="d-flex flex-wrap gap-2 mb-3" role="group"></div>
        <div id="games" class="d-flex flex-column gap-2"></div>
        <p id="empty" class="text-body-secondary d-none" data-i18n="compare_empty"></p>
    </div>
</div>

<script src="/static/pages/compare.js"></script>
</body>
</html>
