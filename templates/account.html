<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Price Tracker</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- installable on a phone (static/manifest.webmanifest, static/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#0d6efd">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="/static/common.css" rel="stylesheet">
    <script src="/static/common.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/market.js"></script>
</head>
<body class="bg-body-tertiary">

<!-- The same header on every page (static/common.js fills the account area) -->
<header class="site-header bg-body border-bottom mb-4">
    <div class="container-xxl d-flex align-items-center gap-2 py-2">
        <a href="/" class="site-brand link-body-emphasis text-decoration-none">🎮 <span>Game Price Tracker</span></a>
        <div class="header-tools ms-auto d-flex align-items-center gap-1">
            <div id="account-area" class="d-flex gap-1 align-items-center"></div>
            <div id="lang-switch" class="btn-group header-setting" role="group" data-i18n-aria-label="language"></div>
            <button type="button" data-toggle-dark class="btn btn-sm btn-secondary header-setting"
                    data-i18n-aria-label="dark_mode" data-i18n-title="dark_mode">🌙</button>
        </div>
    </div>
</header>

<div class="container pb-4" style="max-width: 900px;">

    <div id="loading" class="text-center my-5"><div class="spinner-border text-primary"></div></div>

    <!-- Logged out: log in or create an account -->
    <section id="logged-out" class="card shadow-sm d-none mx-auto" style="max-width: 520px;">
        <div class="card-body">
            <ul class="nav nav-pills mb-3 gap-1" role="tablist">
                <li class="nav-item" role="presentation"><button class="nav-link active" data-form="login" role="tab" data-i18n="log_in"></button></li>
                <li class="nav-item" role="presentation"><button class="nav-link" data-form="register" role="tab" data-i18n="create_account"></button></li>
            </ul>

            <form id="login-form" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="login" data-i18n="username_or_email"></label>
                    <input id="login" name="login" class="form-control" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="login-password" data-i18n="password"></label>
                    <input id="login-password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                </div>
                <div class="alert alert-danger d-none py-2" role="alert"></div>
                <button type="submit" class="btn btn-primary w-100" data-i18n="log_in"></button>
                <button type="button" class="btn btn-link btn-sm w-100 mt-2" data-show="forgot" data-i18n="forgot_password"></button>
            </form>

            <!-- Forgotten password: a link by email, then a new password (?reset=…) -->
            <form id="forgot-form" class="d-none" novalidate>
                <h2 class="h6" data-i18n="forgot_title"></h2>
                <p class="small text-body-secondary" data-i18n="forgot_help"></p>
                <div class="mb-3">
                    <label class="form-label" for="forgot-email" data-i18n="email"></label>
                    <input id="forgot-email" name="email" type="email" class="form-control" autocomplete="email" required>
                </div>
                <div class="alert alert-danger d-none py-2" role="alert"></div>
                <button type="submit" class="btn btn-primary w-100" data-i18n="forgot_send"></button>
                <button type="button" class="btn btn-link btn-sm w-100 mt-2" data-show="login" data-i18n="back_to_login"></button>
            </form>

            <form id="reset-form" class="d-none" novalidate>
                <h2 class="h6" data-i18n="reset_title"></h2>
                <div class="mb-3">
                    <label class="form-label" for="reset-password" data-i18n="password"></label>
                    <input id="reset-password" name="password" type="password" class="form-control" autocomplete="new-password"
                           required minlength="8" aria-describedby="reset-help">
                    <div id="reset-help" class="form-text" data-i18n="password_help"></div>
                </div>
                <div class="alert alert-danger d-none py-2" role="alert"></div>
                <button type="submit" class="btn btn-primary w-100" data-i18n="reset_save"></button>
                <button type="button" class="btn btn-link btn-sm w-100 mt-2" data-show="forgot" data-i18n="reset_ask_again"></button>
            </form>

            <form id="register-form" class="d-none" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="username" data-i18n="username"></label>
                    <input id="username" name="username" class="form-control" autocomplete="username" required
                           minlength="3" maxlength="30" pattern="[A-Za-z0-9_.\-]{3,30}" aria-describedby="username-help">
                    <div id="username-help" class="form-text" data-i18n="username_help"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email" data-i18n="email"></label>
                    <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="display_name" data-i18n="display_name"></label>
                    <input id="display_name" name="display_name" class="form-control" autocomplete="name" maxlength="100"
                           aria-describedby="display-help">
                    <div id="display-help" class="form-text" data-i18n="display_name_help"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="register-password" data-i18n="password"></label>
                    <input id="register-password" name="password" type="password" class="form-control" autocomplete="new-password"
                           required minlength="8" aria-describedby="password-help">
                    <div id="password-help" class="form-text" data-i18n="password_help"></div>
                </div>
                <div class="alert alert-danger d-none py-2" role="alert"></div>
                <button type="submit" class="btn btn-primary w-100" data-i18n="create_account"></button>
            </form>
        </div>
    </section>

    <!-- Logged in: the account (listings, messages and ratings come here next) -->
    <section id="logged-in" class="card shadow-sm d-none">
        <div class="card-body">
            <h1 class="h4 mb-3" data-i18n="my_account"></h1>
            <dl id="account-facts" class="row mb-3"></dl>
            <button type="button" id="logout" class="btn btn-secondary" data-i18n="log_out"></button>

            <!-- A new password: this session stays, the others (other devices) are logged out -->
            <form id="password-form" class="border-top mt-4 pt-3" style="max-width: 420px;" novalidate>
                <h2 class="h6" data-i18n="change_password"></h2>
                <div class="mb-3">
                    <label class="form-label" for="current-password" data-i18n="current_password"></label>
                    <input id="current-password" name="current" type="password" class="form-control"
                           autocomplete="current-password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="new-password" data-i18n="new_password"></label>
                    <input id="new-password" name="password" type="password" class="form-control" autocomplete="new-password"
                           required minlength="8" maxlength="200" aria-describedby="new-password-help">
                    <div id="new-password-help" class="form-text" data-i18n="password_help"></div>
                </div>
                <div class="alert alert-danger d-none py-2" role="alert"></div>
                <button type="submit" class="btn btn-primary" data-i18n="reset_save"></button>
            </form>

            <!-- Deleting the account: anonymised (auth_service.delete_account) -->
            <details class="border-top mt-4 pt-3" style="max-width: 420px;">
                <summary class="h6" data-i18n="delete_account"></summary>
                <form id="delete-form" class="mt-2" novalidate>
                    <p class="small" data-i18n="delete_account_gone"></p>
                    <p class="small" data-i18n="delete_account_kept"></p>
                    <div class="mb-3">
                        <label class="form-label" for="delete-password" data-i18n="current_password"></label>
                        <input id="delete-password" name="password" type="password" class="form-control"
                               autocomplete="current-password" required>
                    </div>
                    <div class="form-check mb-3">
                        <input id="delete-confirm" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="delete-confirm" data-i18n="delete_account_confirm"></label>
                    </div>
                    <div class="alert alert-danger d-none py-2" role="alert"></div>
                    <button type="submit" class="btn btn-danger" data-i18n="delete_account" disabled></button>
                </form>
            </details>
        </div>
    </section>

    <!-- The games this user sells -->
    <section id="my-listings" class="mt-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="h5 mb-0" data-i18n="my_listings"></h2>
            <a href="/sell" class="btn btn-sm btn-success" data-i18n="market_sell"></a>
        </div>
        <div id="my-listings-grid" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-2"></div>
        <p id="my-listings-empty" class="small text-body-secondary d-none" data-i18n="my_listings_empty"></p>
    </section>
</div>

<script src="/static/pages/account.js"></script>
</body>
</html>
