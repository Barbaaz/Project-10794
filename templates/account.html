<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Price Tracker</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- installable on a phone (static/manifest.webmanifest, static/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#0d6efd">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/common.css" rel="stylesheet">
    <script src="/static/common.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/market.js"></script>
</head>
<body class="bg-body-tertiary">

<div class="container py-4" style="max-width: 900px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="/" class="btn btn-sm btn-primary" data-i18n="home"></a>
        <div class="d-flex gap-2">
            <div id="account-area" class="d-flex gap-2"></div>
            <div id="lang-switch" class="btn-group" role="group" data-i18n-aria-label="language"></div>
            <button onclick="toggleDark()" class="btn btn-sm btn-secondary" data-i18n-aria-label="dark_mode">🌙</button>
        </div>
    </div>

    <div id="loading" class="text-center my-5"><div class="spinner-border text-primary"></div></div>

    <!-- Logged out: log in or create an account -->
    <section id="logged-out" class="card shadow-sm d-none mx-auto" style="max-width: 520px;">
        <div class="card-body">
            <ul class="nav nav-pills mb-3 gap-1" role="tablist">
                <li class="nav-item"><button class="nav-link active" data-form="login" role="tab" data-i18n="log_in"></button></li>
                <li class="nav-item"><button class="nav-link" data-form="register" role="tab" data-i18n="create_account"></button></li>
            </ul>

            <form id="login-form" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="login" data-i18n="username_or_email"></label>
                    <input id="login" name="login" class="form-control" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="login-password" data-i18n="password"></label>
                    <input id="login-password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                </div>
                <div class="alert alert-danger d-none py-2" role="alert"></div>
                <button type="submit" class="btn btn-primary w-100" data-i18n="log_in"></button>
                <button type="button" class="btn btn-link btn-sm w-100 mt-2" data-show="forgot" data-i18n="forgot_password"></button>
            </form>

            <!-- Forgotten password: a link by email, then a new password (?reset=…) -->
            <form id="forgot-form" class="d-none" novalidate>
                <h2 class="h6" data-i18n="forgot_title"></h2>
                <p class="small text-body-secondary" data-i18n="forgot_help"></p>
                <div class="mb-3">
                    <label class="form-label" for="forgot-email" data-i18n="email"></label>
                    <input id="forgot-email" name="email" type="email" class="form-control" autocomplete="email" required>
                </div>
                <div class="alert alert-danger d-none py-2" role="alert"></div>
                <button type="submit" class="btn btn-primary w-100" data-i18n="forgot_send"></button>
                <button type="button" class="btn btn-link btn-sm w-100 mt-2" data-show="login" data-i18n="back_to_login"></button>
            </form>

            <form id="reset-form" class="d-none" novalidate>
                <h2 class="h6" data-i18n="reset_title"></h2>
                <div class="mb-3">
                    <label class="form-label" for="reset-password" data-i18n="password"></label>
                    <input id="reset-password" name="password" type="password" class="form-control" autocomplete="new-password"
                           required minlength="8" aria-describedby="reset-help">
                    <div id="reset-help" class="form-text" data-i18n="password_help"></div>
                </div>
                <div class="alert alert-danger d-none py-2" role="alert"></div>
                <button type="submit" class="btn btn-primary w-100" data-i18n="reset_save"></button>
                <button type="button" class="btn btn-link btn-sm w-100 mt-2" data-show="forgot" data-i18n="reset_ask_again"></button>
            </form>

            <form id="register-form" class="d-none" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="username" data-i18n="username"></label>
                    <input id="username" name="username" class="form-control" autocomplete="username" required
                           minlength="3" maxlength="30" pattern="[A-Za-z0-9_.\-]{3,30}" aria-describedby="username-help">
                    <div id="username-help" class="form-text" data-i18n="username_help"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email" data-i18n="email"></label>
                    <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="display_name" data-i18n="display_name"></label>
                    <input id="display_name" name="display_name" class="form-control" autocomplete="name" maxlength="100"
                           aria-describedby="display-help">
                    <div id="display-help" class="form-text" data-i18n="display_name_help"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="register-password" data-i18n="password"></label>
                    <input id="register-password" name="password" type="password" class="form-control" autocomplete="new-password"
                           required minlength="8" aria-describedby="password-help">
                    <div id="password-help" class="form-text" data-i18n="password_help"></div>
                </div>
                <div class="alert alert-danger d-none py-2" role="alert"></div>
                <button type="submit" class="btn btn-primary w-100" data-i18n="create_account"></button>
            </form>
        </div>
    </section>

    <!-- Logged in: the account (listings, messages and ratings come here next) -->
    <section id="logged-in" class="card shadow-sm d-none">
        <div class="card-body">
            <h1 class="h4 mb-3" data-i18n="my_account"></h1>
            <dl id="account-facts" class="row mb-3"></dl>
            <button type="button" id="logout" class="btn btn-secondary" data-i18n="log_out"></button>
        </div>
    </section>

    <!-- The games this user sells -->
    <section id="my-listings" class="mt-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="h5 mb-0" data-i18n="my_listings"></h2>
            <a href="/sell" class="btn btn-sm btn-success" data-i18n="market_sell"></a>
        </div>
        <div id="my-listings-grid" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-2"></div>
        <p id="my-listings-empty" class="small text-body-secondary d-none" data-i18n="my_listings_empty"></p>
    </section>
</div>

<script>
// After logging in: back to where the visitor came from (only our own pages, never another site)
function nextPage() {
    const next = new URLSearchParams(location.search).get("next") || "/";
    return next.startsWith("/") && !next.startsWith("//") ? next : "/";
}

const RESET_TOKEN = new URLSearchParams(location.search).get("reset");    // from the emailed link

function showForm(name) {
    document.querySelectorAll("[data-form]").forEach(b => {
        const selected = b.dataset.form === name;
        b.classList.toggle("active", selected);
        b.setAttribute("aria-selected", selected);
    });
    ["login", "register", "forgot", "reset"].forEach(f =>
        document.getElementById(`${f}-form`).classList.toggle("d-none", name !== f));
}

document.querySelectorAll("[data-form]").forEach(b => b.onclick = () => showForm(b.dataset.form));
document.querySelectorAll("[data-show]").forEach(b => b.onclick = () => showForm(b.dataset.show));

// done(): what happens after it worked (by default, back to where the visitor came from)
function handleForm(id, path, { extra = {}, done = () => location.assign(nextPage()) } = {}) {
    const form = document.getElementById(id);
    const message = form.querySelector(".alert");
    form.onsubmit = async event => {
        event.preventDefault();
        message.className = "alert alert-danger d-none py-2";
        const button = form.querySelector("button[type=submit]");
        button.disabled = true;
        const { ok, data } = await api(path, { body: { ...Object.fromEntries(new FormData(form)), ...extra } });
        button.disabled = false;
        if (ok) return done(message);
        message.textContent = t(`error_${data?.error || "unknown"}`);
        message.classList.remove("d-none");
    };
}

handleForm("login-form", "/api/auth/login");
handleForm("register-form", "/api/auth/register");
handleForm("forgot-form", "/api/auth/forgot", { extra: { lang: LANG }, done: message => {
    message.className = "alert alert-success py-2";
    message.textContent = t("forgot_sent");
} });
handleForm("reset-form", "/api/auth/reset", { extra: { token: RESET_TOKEN }, done: () => location.assign("/account") });

async function load() {
    const user = await fetch("/api/auth/me").then(r => r.json()).catch(() => null);
    document.getElementById("loading").classList.add("d-none");
    if (!user || RESET_TOKEN) {
        document.getElementById("logged-out").classList.remove("d-none");
        if (RESET_TOKEN) showForm("reset");
        else if (location.hash === "#register") showForm("register");
        return;
    }
    const facts = [
        [t("username"), user.username],
        [t("display_name"), user.display_name],
        [t("email"), user.email],
        [t("member_since"), new Date(user.created_at).toLocaleDateString(LOCALE)],
    ];
    document.getElementById("account-facts").innerHTML = facts.map(([k, v]) =>
        `<dt class="col-sm-4 text-body-secondary">${esc(k)}</dt><dd class="col-sm-8">${esc(v)}</dd>`).join("");
    document.getElementById("logout").onclick = async () => {
        await api("/api/auth/logout");
        location.assign("/");
    };
    document.getElementById("logged-in").classList.remove("d-none");

    const mine = await fetch("/api/listings/mine").then(r => r.json()).catch(() => []);
    document.getElementById("my-listings-grid").innerHTML = mine.map(l => listingCard(l, { showSeller: false })).join("");
    document.getElementById("my-listings-empty").classList.toggle("d-none", mine.length > 0);
    document.getElementById("my-listings").classList.remove("d-none");
}

applyI18n();
renderAccountArea();
load();
</script>
</body>
</html>
