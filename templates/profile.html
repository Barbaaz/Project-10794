<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SaveGame</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- installable on a phone (static/manifest.webmanifest, static/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2346d0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="/static/common.css" rel="stylesheet">
    <script src="/static/common.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/market.js"></script>
</head>
<body class="bg-body-tertiary" data-username="{{ username }}">

{% include "_header.html" %}

<div class="container pb-4" style="max-width: 1000px;">

    <div id="loading" class="text-center my-5"><div class="spinner-border text-primary"></div></div>
    <div id="error" class="alert alert-warning d-none" data-i18n="profile_not_found"></div>

    <div id="profile" class="d-none">
        <div class="d-flex align-items-center gap-3 mb-4">
            <div class="display-6">👤</div>
            <div>
                <h1 id="name" class="h3 mb-0"></h1>
                <div id="since" class="text-body-secondary small"></div>
                <div id="location" class="text-body-secondary small d-none"></div>
                <div id="report-user"></div>
                <!-- following (follow_service): counts, the button, and "compare" with a public collection -->
                <div class="d-flex flex-wrap align-items-center gap-2 mt-1">
                    <span id="follow-counts" class="small text-body-secondary"></span>
                    <button type="button" id="follow-button" class="btn btn-sm btn-primary d-none"></button>
                    <a id="edit-profile" href="/account#profile" class="btn btn-sm btn-secondary d-none" data-i18n="edit_profile"></a>
                    <a id="compare-link" class="btn btn-sm btn-secondary d-none" data-i18n="compare_collections"></a>
                </div>
            </div>
            <div class="ms-auto text-end">
                <div id="average" class="fs-3 fw-bold"></div>
                <div id="count" class="small text-body-secondary"></div>
            </div>
        </div>

        <!-- The showcase (collection_service.showcase): the sections the user chose, in their order;
             only with a public collection. On their own profile, "Personalizar" edits it -->
        <details id="showcase-editor" class="card card-body py-2 mb-3 d-none">
            <summary class="fw-semibold" data-i18n="showcase_edit"></summary>
            <p id="showcase-private" class="small text-body-secondary mt-2 mb-0 d-none" data-i18n="showcase_private"></p>
            <h3 class="h6 mt-3 mb-1" data-i18n="showcase_sections"></h3>
            <ul id="showcase-section-list" class="list-group mb-3"></ul>
            <h3 class="h6 mb-1" data-i18n="showcase_favourites"></h3>
            <p class="small text-body-secondary mb-1" data-i18n="showcase_favourites_help"></p>
            <ol id="showcase-favourite-list" class="list-group list-group-numbered mb-2"></ol>
            <div class="input-group input-group-sm mb-3">
                <select id="showcase-add" class="form-select" data-i18n-aria-label="showcase_add"></select>
                <button type="button" id="showcase-add-button" class="btn btn-secondary" data-i18n="showcase_add"></button>
            </div>
            <div class="d-flex align-items-center gap-2">
                <button type="button" id="showcase-save" class="btn btn-primary btn-sm" data-i18n="showcase_save"></button>
                <span id="showcase-saved" class="small" role="status"></span>
            </div>
        </details>
        <div id="showcase" class="mb-2"></div>

        <!-- Their own profile only: who they follow (only they see it) -->
        <section id="following" class="mb-4 d-none">
            <h2 class="h5" data-i18n="following_title"></h2>
            <div id="following-list" class="list-group"></div>
            <p id="following-none" class="small text-body-secondary d-none" data-i18n="following_none"></p>
        </section>

        <h2 class="h5" data-i18n="profile_ratings"></h2>
        <div id="ratings" class="list-group mb-4"></div>
        <p id="no-ratings" class="small text-body-secondary d-none" data-i18n="profile_no_ratings"></p>

        <!-- Only when the user made their collection public: how many, and its own page (user, 2026-10-12) -->
        <section id="collection" class="mb-4 d-none">
            <h2 class="h5" data-i18n="profile_collection"></h2>
            <p id="collection-summary" class="small text-body-secondary mb-2"></p>
            <a id="collection-link" class="btn btn-sm btn-primary" data-i18n="profile_see_collection"></a>
        </section>

        <!-- Their reviews of games (app/services/review_service.py); only when there are some -->
        <section id="game-reviews" class="mb-4 d-none">
            <h2 class="h5" data-i18n="profile_game_reviews"></h2>
            <div id="game-reviews-list" class="list-group"></div>
        </section>

        <h2 class="h5" data-i18n="profile_listings"></h2>
        <div id="listings" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-2"></div>
        <p id="no-listings" class="small text-body-secondary d-none" data-i18n="profile_no_listings"></p>
    </div>
</div>

<script src="/static/pages/profile.js"></script>
</body>
</html>
