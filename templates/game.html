<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Price Tracker</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- installable on a phone (static/manifest.webmanifest, static/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2346d0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="/static/common.css" rel="stylesheet">
    <script src="/static/common.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/market.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" integrity="sha384-NrKB+u6Ts6AtkIhwPixiKTzgSKNblyhlk0Sohlgar9UHUBzai/sgnNNWWd291xqt" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js" integrity="sha384-cVMg8E3QFwTvGCDuK+ET4PD341jF3W8nO1auiXfuZNQkzbUUiBGLsIQUE+b1mxws" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js" integrity="sha384-3N9GHhCtN3CQef6tNfqgZlv7sQLYIkcChN+uaTZ7xVdzKYp/SjBNPxa92+hM7EAY" crossorigin="anonymous"></script>

    <style>
        /* Chart colors by role. Store colors are a validated categorical palette
           (fixed slot per store, see /api/stores color_slot); dark mode has its own steps. */
        :root {
            --surface-1: #fcfcfb;
            --text-primary: #0b0b0b;
            --text-secondary: #52514e;
            --text-muted: #898781;
            --gridline: #e1e0d9;
            --baseline: #c3c2b7;
            --series-1: #2a78d6;
            --series-2: #eb6834;
            --series-3: #1baf7a;
            --series-4: #eda100;
            --series-5: #e87ba4;
            --series-6: #008300;
        }
        :root[data-bs-theme="dark"] {
            --surface-1: #1a1a19;
            --text-primary: #ffffff;
            --text-secondary: #c3c2b7;
            --text-muted: #898781;
            --gridline: #2c2c2a;
            --baseline: #383835;
            --series-1: #3987e5;
            --series-2: #d95926;
            --series-3: #199e70;
            --series-4: #c98500;
            --series-5: #d55181;
            --series-6: #008300;
        }

        .chart-box { position: relative; height: 280px; background: var(--surface-1); border-radius: .5rem; padding: .5rem; }
        /* The page: the game on the left, the buy box on the right (sticky, the whole way down) */
        .gp { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1.75rem 2rem; align-items: start;
              grid-template-areas: "top buy" "media buy" "market buy" "reviews buy" "history buy"; }
        .gp.d-none { display: none; }
        .gp-top { grid-area: top; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 1.75rem; align-items: start; }
        .gp-buy { grid-area: buy; align-self: stretch; }
        .gp-media { grid-area: media; } .gp-market { grid-area: market; } .gp-reviews { grid-area: reviews; } .gp-history { grid-area: history; }
        .gp-panel { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: .875rem; padding: 1.25rem 1.4rem; }
        .buy-box { position: sticky; top: 1rem; background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: .875rem;
                   padding: 1.15rem 1.2rem; display: grid; gap: 1rem; }
        .buy-label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--bs-secondary-color); margin-bottom: .4rem; }
        .best-price { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
        .buy-box .offer-row { padding: .6rem .8rem; gap: .55rem; font-size: .92rem; }
        .buy-box .offer-row .stock { font-size: .82rem; }
        .cover-thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .4rem; margin-top: .6rem; }
        .cover-thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: .5rem; }
        .other-platforms { color: var(--bs-secondary-color); font-size: .92rem; }
        .other-platforms:empty { display: none; }
        .other-platforms a { font-weight: 700; text-decoration: none; }
        .video-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; }
        .video-grid .video-thumb, .video-grid .video-thumb img { width: 100%; height: auto; }
        .video-grid .video-thumb img { aspect-ratio: 16 / 9; object-fit: cover; border-radius: .625rem; }
        /* the play button in the middle of the picture (the name line under it is ~1.4rem tall) */
        .video-grid .video-thumb .play { top: calc((100% - 1.4rem) / 2); }
        @media (max-width: 1199.98px) { .gp-top { grid-template-columns: 200px minmax(0, 1fr); } .gp { grid-template-columns: minmax(0, 1fr) 310px; } }
        /* Narrower: one column, in this order: cover, title, buy box, then the rest */
        @media (max-width: 991.98px) {
            .gp { display: flex; flex-direction: column; gap: 1.25rem; }
            .gp-top, .gp-info { display: contents; }
            .gp-cover { order: 1; } .gp-head { order: 2; } .gp-buy { order: 3; } .other-platforms { order: 4; } #about { order: 5; margin-top: 0 !important; }
            #edition-info { order: 6; margin-top: 0 !important; } .gp-media { order: 7; } .gp-market { order: 8; } .gp-reviews { order: 9; } .gp-history { order: 10; }
            .gp-cover { display: flex; gap: .75rem; align-items: flex-start; }
            .gp-cover .game-cover { width: 150px; flex: none; }
            .gp-cover .cover-thumbs { display: none; }
            .buy-box { position: static; }
            .gp-panel { padding: 1rem; }
            .video-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        .back-link { font-size: .9rem; font-weight: 600; text-decoration: none; color: var(--bs-secondary-color); }
        .back-link:hover { color: var(--bs-emphasis-color); }
        /* An edition's stores: one row each (stock dot, store, stock, price), the whole row opens the store */
        .offer-rows { border: 1px solid var(--bs-border-color); border-radius: .875rem; overflow: hidden; background: var(--bs-body-bg); }
        .offer-row { display: flex; align-items: center; gap: .75rem; padding: .75rem 1.1rem; color: var(--bs-body-color); text-decoration: none; }
        .offer-row + .offer-row { border-top: 1px solid var(--bs-border-color); }
        .offer-row:hover { background: var(--bs-tertiary-bg); color: var(--bs-body-color); }
        .offer-row .dot { width: 8px; height: 8px; border-radius: 50%; background: #1f9d5c; flex: none; }
        .offer-row.out .dot { background: var(--bs-secondary-color); opacity: .5; }
        .offer-row .store { flex: 1; min-width: 0; font-weight: 500; }
        .offer-row .stock { color: var(--bs-secondary-color); font-size: .9rem; white-space: nowrap; }
        .offer-row .price { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .offer-row.out .price { color: var(--bs-secondary-color); }
        .offer-row .go { color: var(--bs-secondary-color); font-size: .85rem; }
        @media (max-width: 575.98px) { .offer-row { padding-inline: .8rem; gap: .5rem; } .offer-row .stock { font-size: .8rem; } }
        .gp.no-cover .gp-top { grid-template-columns: minmax(0, 1fr); }
        .game-cover { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; background: var(--bs-secondary-bg); border-radius: .875rem;
                      box-shadow: 0 12px 30px rgb(20 23 31 / .18); }
        .game-kicker { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--bs-primary); }
        .game-name { font-size: clamp(1.6rem, 3.5vw, 2.3rem); line-height: 1.1; margin: .2rem 0 0; }
        .d-contents { display: contents; }
        .badge-soft { background: var(--bs-secondary-bg); color: var(--bs-emphasis-color); font-weight: 700; font-size: .8rem; border-radius: .4rem; }
        .badge-critics { background: var(--save-bg); color: var(--save); }
        .badge-release { background: var(--bs-primary-bg-subtle); color: var(--bs-primary-text-emphasis); }
        /* The best price of any edition: one card, the price large */
        .best-card { background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: .875rem; padding: 1rem 1.25rem;
                     display: grid; gap: .15rem; justify-items: start; }
        .best-card .lbl { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--bs-secondary-color); }
        .best-card .big { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
        .best-card .btn { margin-top: .6rem; }
        /* An edition's price history: a panel of its own under the stores */
        .chart-panel { border: 1px solid var(--bs-border-color); border-radius: .875rem; background: var(--bs-body-bg); padding: 1rem 1.1rem; }
        .chart-box { background: var(--bs-body-bg) !important; }
        /* Editions: panels with a border, no shadow */
        .edition-card { border: 1px solid var(--bs-border-color); border-radius: .875rem; background: var(--bs-body-bg); }
        .swatch { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
        .low-badge { background: var(--bs-success-bg-subtle); color: var(--bs-success-text-emphasis); border: 1px solid var(--bs-success-border-subtle); }
        table.prices td, table.prices th { font-variant-numeric: tabular-nums; }
        .facts { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 1.25rem; row-gap: .35rem; font-size: .92rem; }
        .offer-link { white-space: nowrap; }
        .facts dt { font-weight: 400; color: var(--bs-secondary-color); }
        .facts dd { margin: 0; font-weight: 600; }
        .clamped { display: -webkit-box; -webkit-line-clamp: var(--lines); -webkit-box-orient: vertical; overflow: hidden; }
        .clamped.open { display: block; }
        .screenshots { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .25rem; }
        .screenshots img { height: 120px; border-radius: .375rem; }
        /* The game's pictures: two a row, 16:9, rounded; the rest behind "more" */
        .shot-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .6rem; }
        .shot-grid img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: .625rem; background: var(--bs-secondary-bg); }
        .shot-grid.store-photos img { object-fit: contain; background: #fff; }
        .shot-grid a[hidden] { display: none; }
        .edition-info ul { padding-left: 1.2rem; }
        .video-thumb { position: relative; flex-shrink: 0; width: 213px; padding: 0; border: 0; background: none; text-align: left; }
        .video-thumb img { width: 213px; height: 120px; object-fit: cover; }
        .video-thumb .play { position: absolute; left: 50%; top: 60px; transform: translate(-50%, -50%);
            width: 44px; height: 44px; border-radius: 50%; background: rgba(0, 0, 0, .7); color: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .video-thumb:hover .play, .video-thumb:focus-visible .play { background: #c00; }
        .review-scores { display: grid; grid-template-columns: repeat(10, 1fr); gap: .25rem; max-width: 26rem; }
        .review-scores .btn { padding-left: 0; padding-right: 0; }
        /* solid grey buttons; the picked score in the primary colour */
        .review-scores .btn { --bs-btn-active-bg: var(--bs-primary); --bs-btn-active-border-color: var(--bs-primary); --bs-btn-active-color: #fff; }
        .review-bars { min-width: 12rem; max-width: 26rem; }
        .video-thumb .name { display: block; font-size: .8rem; margin-top: .2rem; color: var(--bs-body-color);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body class="bg-body-tertiary" data-game-id="{{ game_id }}">

{% include "_header.html" %}

<div class="container pb-4" style="max-width: 1240px;">
    <div class="mb-3"><a href="/" id="back-link" class="back-link" data-i18n="back"></a></div>

    <div id="loading" class="text-center my-5"><div class="spinner-border text-primary"></div></div>
    <div id="error" class="alert alert-warning d-none"></div>

    <!-- The shop page layout (user's choice of the mock-ups, 2026-10-10, "1 · Caixa de compra"): the
         game on the left (cover and details, then its pictures and videos, used copies, reviews, and
         the price history last), the buy box on the right, on screen all the way down. On a phone one
         column, the buy box right after the title. -->
    <div id="game" class="d-none gp">
        <div class="gp-top">
            <div class="gp-cover">
                <img id="cover" class="game-cover" alt="">
                <div id="cover-thumbs" class="cover-thumbs"></div>
            </div>
            <div class="gp-info min-w-0">
                <div class="gp-head">
                    <div id="platform" class="game-kicker"></div>
                    <h1 id="title" class="game-name"></h1>
                    <div class="d-flex flex-wrap gap-2 mt-2">
                        <span id="critics" class="badge badge-soft badge-critics d-none"></span>
                        <span id="release" class="badge badge-soft badge-release d-none"></span>
                        <span id="pegi" class="badge badge-soft d-none"></span>
                        <span id="year" class="badge badge-soft d-none"></span>
                        <span id="genres" class="d-contents"></span>
                    </div>
                </div>
                <!-- The same game on other platforms ("Também para Xbox Series X|S, desde 47,89 €") -->
                <div id="other-platforms" class="other-platforms mt-3"></div>
                <!-- About the game: the store's description (Portuguese) and / or IGDB's summary, the facts
                     (publisher, release, time to beat…), what the chosen edition includes -->
                <section id="about" class="mt-3 d-none">
                    <h2 class="h6 mb-2" data-i18n="about"></h2>
                    <div id="about-text"></div>
                    <dl id="facts" class="facts mt-3 mb-0"></dl>
                </section>
                <div id="edition-info" class="mt-3"></div>
            </div>
        </div>

        <!-- The buy box: the chosen edition's best price and its store, the editions, every store's
             price, the lowest price, Tenho / Quero -->
        <aside class="gp-buy">
            <div class="buy-box">
                <div id="price-summary"></div>
                <div id="edition-pick">
                    <div class="buy-label" data-i18n="edition"></div>
                    <div id="edition-chips" class="d-flex flex-wrap gap-2"></div>
                </div>
                <div id="editions"></div>
            </div>
        </aside>

        <!-- The game's pictures and videos -->
        <section id="media" class="gp-media gp-panel d-none">
            <h2 class="h5 mb-3" data-i18n="pictures_videos"></h2>
            <div id="screenshots" class="shot-grid"></div>
            <button type="button" id="shots-more" class="btn btn-sm btn-secondary mt-2 d-none"></button>
            <div id="videos" class="mt-3 d-none">
                <div id="video-player" class="ratio ratio-16x9 mb-2 d-none"></div>
                <div id="video-list" class="video-grid"></div>
                <div class="small text-body-secondary mt-1" data-i18n="video_source"></div>
            </div>
            <!-- IGDB's terms ask for a visible credit where its data is shown -->
            <div id="igdb-credit" class="small text-body-secondary mt-3 d-none"><span data-i18n="igdb_credit_game"></span> <a href="https://www.igdb.com" target="_blank" rel="noopener">IGDB.com</a></div>
        </section>

        <!-- Pre-owned copies people sell (the marketplace) -->
        <section id="market" class="gp-market gp-panel">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h2 class="h5 mb-0" data-i18n="market_title"></h2>
                <a id="sell-link" href="/sell" class="btn btn-sm btn-success" data-i18n="market_sell_this"></a>
            </div>
            <div id="market-listings" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-2"></div>
            <p id="market-empty" class="small text-body-secondary d-none" data-i18n="market_empty"></p>
        </section>

        <!-- Players' reviews of this game on this platform, 1–10 -->
        <section id="reviews" class="gp-reviews gp-panel">
            <div>
                <h2 class="h5 mb-0" data-i18n="reviews_title"></h2>
                <p id="reviews-platform" class="small text-body-secondary mb-3"></p>
                <div id="reviews-summary" class="d-flex flex-wrap align-items-center gap-4 mb-3"></div>
                <div id="review-mine" class="mb-3"></div>
                <div id="reviews-list" class="d-flex flex-column gap-3"></div>
                <button id="reviews-more" type="button" class="btn btn-sm btn-secondary mt-3 d-none"
                        data-i18n="reviews_more"></button>
            </div>
        </section>

        <!-- The chosen edition's price history, last -->
        <section id="history" class="gp-history gp-panel d-none">
            <h2 class="h5 mb-3"><span data-i18n="price_history"></span> <span id="history-edition" class="small text-body-secondary fw-normal"></span></h2>
            <div id="history-charts"></div>
            <p id="history-note" class="text-body-secondary small mt-2 mb-0"></p>
        </section>
    </div>
</div>

<script src="/static/pages/game.js"></script>
</body>
</html>
