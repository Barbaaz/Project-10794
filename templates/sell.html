<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Price Tracker</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- installable on a phone (static/manifest.webmanifest, static/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2346d0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="/static/common.css" rel="stylesheet">
    <script src="/static/common.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/market.js"></script>
    <style>
        .photo-previews { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: .5rem; }
        .photo-previews figure { position: relative; margin: 0; }
        .photo-previews img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: .375rem; }
        .photo-previews button { position: absolute; top: .25rem; right: .25rem; }
        .photo-previews .first { position: absolute; left: .25rem; bottom: .25rem; }
    </style>
</head>
<body class="bg-body-tertiary">

{% include "_header.html" %}

<div class="container pb-4" style="max-width: 720px;">

    <h1 class="h3 mb-1" data-i18n="sell_title"></h1>
    <p class="small text-body-secondary mb-3" data-i18n="sell_physical_only"></p>

    <form id="sell-form" class="card shadow-sm" novalidate>
        <div class="card-body">
            <!-- 1. The game -->
            <div class="mb-3">
                <label class="form-label fw-semibold" for="game-search" data-i18n="sell_game"></label>
                <div id="chosen-game" class="d-none d-flex align-items-center gap-2 mb-2"></div>
                <div id="game-picker">
                    <input id="game-search" class="form-control" autocomplete="off" data-i18n-placeholder="sell_game_search">
                    <div id="game-results" class="list-group mt-1"></div>
                    <!-- Not in the catalogue (older platforms, games no store sells): search IGDB -->
                    <button type="button" id="igdb-search" class="btn btn-sm btn-secondary mt-2 d-none" data-i18n="sell_search_igdb"></button>
                    <div id="igdb-results" class="list-group mt-1"></div>
                </div>
            </div>

            <!-- 2. Edition, condition, price -->
            <div class="row g-3 mb-3">
                <div class="col-sm-5">
                    <label class="form-label fw-semibold" for="edition" data-i18n="sell_edition"></label>
                    <select id="edition" name="edition_id" class="form-select" disabled></select>
                </div>
                <div class="col-sm-4">
                    <label class="form-label fw-semibold" for="condition" data-i18n="sell_condition"></label>
                    <select id="condition" name="condition" class="form-select" required></select>
                </div>
                <div class="col-sm-3">
                    <label class="form-label fw-semibold" for="price" data-i18n="sell_price"></label>
                    <div class="input-group">
                        <input id="price" name="price" type="number" min="0.5" max="10000" step="0.01" class="form-control" required>
                        <span class="input-group-text">€</span>
                    </div>
                </div>
            </div>
            <div id="store-price-hint" class="small text-body-secondary mb-3"></div>

            <!-- 3. Description -->
            <div class="mb-3">
                <label class="form-label fw-semibold" for="description" data-i18n="sell_description"></label>
                <textarea id="description" name="description" rows="4" maxlength="2000" class="form-control"
                          data-i18n-placeholder="sell_description_placeholder"></textarea>
            </div>

            <!-- 4. Photos (3 to 10) -->
            <div class="mb-3">
                <div class="form-label fw-semibold" id="photos-label" data-i18n="sell_photos"></div>
                <!-- the browser's file field is hidden: its button and "no file chosen" don't fit a phone -->
                <input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
                <div class="d-flex align-items-center gap-2">
                    <button type="button" id="add-photos" class="btn btn-secondary"
                            aria-describedby="photos-label photos-count photos-help" data-i18n="sell_add_photos"></button>
                    <span id="photos-count" class="small text-body-secondary"></span>
                </div>
                <div id="photos-help" class="form-text" data-i18n="sell_photos_help"></div>
                <div id="previews" class="photo-previews mt-2"></div>
            </div>

            <div id="sell-error" class="alert alert-danger d-none py-2" role="alert"></div>
            <button type="submit" id="publish" class="btn btn-primary w-100" data-i18n="sell_publish"></button>
        </div>
    </form>
</div>

<script src="/static/pages/sell.js"></script>
</body>
</html>
