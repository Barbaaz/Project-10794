<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SaveGame</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- installable on a phone (static/manifest.webmanifest, static/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2346d0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="/static/common.css" rel="stylesheet">
    <script src="/static/common.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/market.js"></script>
</head>
<body class="bg-body-tertiary" data-username="{{ username }}">

{% include "_header.html" %}

<!-- A user's public collection as a grid of covers (user_collection.js; user, 2026-10-12: its own page) -->
<div class="container pb-4">
    <div id="loading" class="text-center my-5"><div class="spinner-border text-primary"></div></div>
    <div id="error" class="alert alert-warning d-none" data-i18n="user_collection_private"></div>

    <div id="content" class="d-none">
        <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
            <h1 id="title" class="h4 mb-0 me-auto"></h1>
            <a id="compare-link" class="btn btn-sm btn-secondary d-none" data-i18n="compare_collections"></a>
        </div>
        <p id="summary" class="small text-body-secondary"></p>
        <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
            <input id="filter-text" type="search" class="form-control form-control-sm w-auto"
                   data-i18n-placeholder="collection_filter" data-i18n-aria-label="collection_filter">
            <select id="filter-status" class="form-select form-select-sm w-auto" data-i18n-aria-label="collection_status"></select>
            <select id="sort" class="form-select form-select-sm w-auto" data-i18n-aria-label="collection_sort"></select>
        </div>
        <div id="filter-platforms" class="d-flex flex-wrap gap-2 mb-3" role="group" data-i18n-aria-label="collection_platforms"></div>
        <div id="items" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3"></div>
        <p id="empty" class="text-body-secondary d-none" data-i18n="no_results"></p>
    </div>
</div>

<script src="/static/pages/user_collection.js"></script>
</body>
</html>
