<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Price Tracker</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- installable on a phone (static/manifest.webmanifest, static/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#0d6efd">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="/static/common.css" rel="stylesheet">
    <script src="/static/common.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/market.js"></script>

    <style>
        .game-card .cover-link { display: block; overflow: hidden; background: #000; }
        .game-card img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; transition: transform .3s ease; }
        /* A store's photo (square, a 3D box shot...) is shown whole on white, not cropped to the card;
           the game's IGDB cover already has the card's shape */
        .game-card img.store-photo { object-fit: contain; background: #fff; }
        .game-card:hover img { transform: scale(1.04); }
        .game-card .card-body { padding: .5rem; font-size: .8rem; }
        /* Every card has the same layout: title always 2 lines tall, platform 1 line,
           extra line (release date, historical low...) 2 lines; longer text ends in "…" */
        .game-title {
            font-size: .85rem; font-weight: 600; line-height: 1.25; margin-bottom: .15rem;
            height: 2.5em;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-platform { line-height: 1.4; height: 1.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .platform-chip { --bs-btn-padding-y: .05rem; --bs-btn-padding-x: .4rem; --bs-btn-font-size: .72rem; }
        .card-extra {
            line-height: 1.4; height: 2.8em; margin-bottom: .4rem;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .fav-btn {
            position: absolute; top: .4rem; right: .4rem; width: 1.75rem; height: 1.75rem; padding: 0;
            border-radius: 50%; line-height: 1; font-size: 1.05rem;
        }
        /* 📚 / ⭐ under the star: the edition is in the user's collection / wishlist */
        .fav-mark { position: absolute; right: -.3rem; bottom: -.3rem; font-size: .65rem; line-height: 1; }
        /* The star's menu (favourite, collection, wishlist), inside the cover so the card doesn't clip it */
        .card-menu { top: 2.4rem; right: .4rem; min-width: 9rem; font-size: .85rem; z-index: 5; }
        .card-menu .check { display: inline-block; width: 1.1rem; }
        /* One button per store, linking to the product on the store's site */
        .offer-btn {
            display: flex; justify-content: space-between; align-items: baseline; gap: .4rem;
            width: 100%; margin-top: .3rem; padding: .25rem .45rem; font-size: .78rem; text-align: left;
        }
        .offer-btn .store { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .offer-btn .price { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 700; }
        .offer-btn .was { font-weight: 400; text-decoration: line-through; opacity: .75; margin-right: .2rem; }
        .discount-badge { position: absolute; top: .4rem; left: .4rem; font-size: .8rem; }
        .low-price-badge { position: absolute; bottom: .4rem; left: .4rem; font-size: .75rem; }
        .release-date { width: 3.2rem; }
        .release-item img { width: 40px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: .25rem; background: #000; }
        .min-w-0 { min-width: 0; }
        /* Catalogue filters, labels above: always shown from tablet width, behind "Filtros" on a phone */
        .catalog-filters { display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
        .catalog-filters.open { display: grid; }
        @media (min-width: 768px) { .catalog-filters { display: grid; grid-template-columns: repeat(4, minmax(0, 13rem)); } }
    </style>
</head>

<body class="bg-body-tertiary">

<!-- The same header on every page (static/common.js fills the account area) -->
<header class="site-header bg-body border-bottom mb-4">
    <div class="container-xxl d-flex align-items-center gap-2 py-2">
        <h1 class="site-brand m-0"><a href="/" data-go-home class="link-body-emphasis text-decoration-none">🎮 <span>Game Price Tracker</span></a></h1>
        <div class="header-tools ms-auto d-flex align-items-center gap-1">
            <!-- Back to the front page; shown while search results are on screen -->
            <button id="home-btn" data-go-home class="btn btn-sm btn-primary d-none" data-i18n="home">🏠 Início</button>
            <div id="account-area" class="d-flex gap-1 align-items-center"></div>
            <div id="lang-switch" class="btn-group header-setting" role="group" data-i18n-aria-label="language"></div>
            <button type="button" data-toggle-dark class="btn btn-sm btn-secondary header-setting"
                    data-i18n-aria-label="dark_mode" data-i18n-title="dark_mode">🌙</button>
        </div>
    </div>
</header>

<div class="container-xxl pb-4">

    <form class="row g-2 mb-4" id="search-form">
        <div class="col-md-6">
            <input type="text" id="q" class="form-control" data-i18n-placeholder="search_placeholder" autofocus>
        </div>
        <div class="col-md-3">
            <select id="consoleFilter" class="form-select" data-i18n-aria-label="platform">
                <option value="" data-i18n="all_platforms"></option>
            </select>
        </div>
        <div class="col-md-3 d-grid">
            <button type="submit" class="btn btn-primary" data-i18n="search"></button>
        </div>
    </form>

    <!-- Favourites that came back in stock (filled by loadRestockAlerts) -->
    <div id="alerts"></div>

    <!-- Front page: the visitor picks what to see; the choice is remembered in this browser -->
    <section id="front" class="mb-4">
        <ul class="nav nav-pills mb-3 gap-1 front-tabs scroll-tabs" role="tablist">
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="discounts" role="tab" data-i18n="tab_discounts"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="preorders" role="tab" data-i18n="tab_preorders"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="releases" role="tab" data-i18n="tab_releases"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="catalog" role="tab" data-i18n="tab_catalog"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="special" role="tab" data-i18n="tab_special"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="market" role="tab" data-i18n="tab_market"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="wishlist" role="tab" data-i18n="tab_wishlist"></button></li>
        </ul>
        <div id="front-loading" class="text-center my-4 d-none"><div class="spinner-border text-primary"></div></div>
        <div id="front-content"></div>
        <p id="front-empty" class="text-body-secondary small d-none mb-0"></p>
    </section>

    <div id="loading" class="text-center my-4 d-none"><div class="spinner-border text-primary"></div></div>
    <p id="empty" class="text-body-secondary d-none" data-i18n="no_results"></p>

    <div id="results"></div>

    <!-- When each store's prices were last updated; ⚠ when a run failed or a store is out of date -->
    <footer id="store-status" class="small text-body-secondary border-top mt-5 pt-3"></footer>
</div>

<script src="/static/pages/index.js"></script>
</body>
</html>
