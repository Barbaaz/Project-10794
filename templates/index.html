<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Price Tracker</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- installable on a phone (static/manifest.webmanifest, static/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2346d0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="/static/common.css" rel="stylesheet">
    <script src="/static/common.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/market.js"></script>

    <style>
        /* Cards without a box: the cover carries them (rounded), then platform, name and prices */
        .game-card .cover-link { display: block; overflow: hidden; border-radius: .75rem; background: var(--bs-secondary-bg); }
        .game-card img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; transition: transform .3s ease; }
        /* A store's photo (square, a 3D box shot...) is shown whole on white, not cropped to the card;
           the game's IGDB cover already has the card's shape */
        .game-card img.store-photo { object-fit: contain; background: #fff; }
        .game-card:hover img { transform: scale(1.03); }
        @media (prefers-reduced-motion: reduce) { .game-card img { transition: none; } .game-card:hover img { transform: none; } }
        .game-card .card-text { padding-top: .65rem; font-size: .9rem; }
        /* Every card has the same layout: platform 1 line, title always 2 lines tall,
           extra line (release date, historical low...) 2 lines; longer text ends in "…" */
        .card-platform { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--bs-primary);
                         line-height: 1.4; height: 1.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .game-title {
            font-size: 1rem; font-weight: 700; line-height: 1.25; margin-top: .1rem;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .platform-chip { --bs-btn-padding-y: .05rem; --bs-btn-padding-x: .45rem; --bs-btn-font-size: .72rem; border-radius: 999px; }
        .card-extra {
            line-height: 1.4; height: 2.8em; margin-top: .2rem; color: var(--bs-secondary-color);
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        /* Prices: the best one large, the others quiet lines; each opens the store's page */
        .lead-offer { display: block; color: inherit; text-decoration: none; border-radius: .4rem; }
        .lead-offer .amount { display: block; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em;
                              font-variant-numeric: tabular-nums; line-height: 1.2; }
        .lead-offer .amount .badge { font-size: .7rem; vertical-align: 3px; }
        .lead-offer .was { font-size: .8rem; font-weight: 500; color: var(--bs-secondary-color); }
        .lead-offer .where { display: block; color: var(--bs-secondary-color); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .lead-offer:hover .amount { color: var(--bs-link-hover-color); }
        .lead-offer.out .amount { color: var(--bs-secondary-color); }
        .card-edition { color: var(--bs-secondary-color); font-size: .85rem; line-height: 1.35; height: 1.35em;
                        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Copies users sell: a line in their own colour under the store price */
        .used-line { display: block; margin-top: .3rem; font-size: .82rem; font-weight: 600; color: var(--used); text-decoration: none; }
        .used-line:hover { text-decoration: underline; color: var(--used); }
        /* Room between the cards, as in the mock-up */
        .card-grid { --bs-gutter-x: 1.25rem; --bs-gutter-y: 1.75rem; }
        @media (max-width: 767.98px) { .card-grid { --bs-gutter-x: .875rem; --bs-gutter-y: 1.4rem; } }
        /* Cover badges: savings white with green text, a discount red, a pre-order dark */
        .badge-save { background: #fff; color: #0f7a4a; }
        .badge-pre { background: #14171f; color: #fff; }
        .fav-btn {
            position: absolute; top: .4rem; right: .4rem; width: 1.75rem; height: 1.75rem; padding: 0;
            border-radius: 50%; line-height: 1; font-size: 1.05rem;
        }
        /* 📚 / ⭐ under the star: the edition is in the user's collection / wishlist */
        .fav-mark { position: absolute; right: -.3rem; bottom: -.3rem; font-size: .65rem; line-height: 1; }
        /* The star's menu (favourite, collection, wishlist), inside the cover so the card doesn't clip it */
        .card-menu { top: 2.4rem; right: .4rem; min-width: 9rem; font-size: .85rem; z-index: 5; }
        .card-menu .check { display: inline-block; width: 1.1rem; }
        /* The page is as wide as the mock-up's shop (four big covers a row) */
        .front-wrap { max-width: 1240px; }
        /* The sections' tabs: a white band under the header, edge to edge (the shadow / clip pair
           paints it past the container without widening the page) */
        .tabs-band { background: var(--bs-body-bg); box-shadow: 0 0 0 100vmax var(--bs-body-bg); clip-path: inset(0 -100vmax);
                     border-bottom: 1px solid var(--bs-border-color); margin-bottom: 1.6rem; }
        .tabs-band .front-tabs { border-bottom: 0; }
        /* "Melhores preços" and its line, the platform chips on the right */
        .section-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: .75rem 1.5rem; margin-bottom: 1.25rem; }
        .section-title { font-size: 1.65rem; margin: 0; }
        .section-sub { margin: .15rem 0 0; color: var(--bs-secondary-color); font-size: .95rem; max-width: 60ch; }
        .section-sub:empty { display: none; }
        .platform-picker { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
        /* On a phone the chips are one row that scrolls sideways */
        @media (max-width: 767.98px) {
            .platform-picker { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; width: 100%; padding-bottom: 2px; }
            .platform-picker #platform-chips { flex-wrap: nowrap !important; }
            .platform-picker .chip-btn, .platform-picker .chip-select { flex-shrink: 0; white-space: nowrap; }
        }
        /* The release calendar: the price as text, the store under it */
        .release-price { flex-shrink: 0; text-align: right; text-decoration: none; color: var(--bs-body-color); line-height: 1.2; }
        .release-price .amount { display: block; font-weight: 800; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
        .release-price .where { display: block; font-size: .78rem; color: var(--bs-secondary-color); }
        .release-price:hover .amount { color: var(--bs-link-hover-color); }
        .release-item img { border-radius: .4rem !important; }
        .discount-badge { position: absolute; top: .5rem; left: .5rem; font-size: .78rem; font-weight: 800; border-radius: .4rem;
                          box-shadow: 0 1px 3px rgb(0 0 0 / .2); }
        .low-price-badge { position: absolute; bottom: .5rem; left: .5rem; font-size: .75rem; border-radius: .4rem;
                           background: var(--save-bg); color: var(--save); }
        .release-date { width: 3.2rem; }
        .release-item img { width: 40px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: .25rem; background: #000; }
        .min-w-0 { min-width: 0; }
        /* Catalogue filters, labels above: always shown from tablet width, behind "Filtros" on a phone */
        .catalog-filters { display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem; }
        .catalog-filters.open { display: grid; }
        @media (min-width: 768px) { .catalog-filters { display: grid; grid-template-columns: repeat(4, minmax(0, 13rem)); } }
    </style>
</head>

<body class="bg-body-tertiary">

{% set home = true %}
{% include "_header.html" %}

<div class="container-xxl front-wrap pb-4">

    <!-- The front page's sections, in a white band under the header; the visitor's choice is
         remembered in this browser -->
    <nav class="tabs-band" data-i18n-aria-label="sections">
        <ul class="nav nav-pills front-tabs" role="tablist">
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="discounts" role="tab" data-i18n="tab_discounts"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="preorders" role="tab" data-i18n="tab_preorders"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="releases" role="tab" data-i18n="tab_releases"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="catalog" role="tab" data-i18n="tab_catalog"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="special" role="tab" data-i18n="tab_special"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="hardware" role="tab" data-i18n="tab_hardware"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="market" role="tab" data-i18n="tab_market"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="wishlist" role="tab" data-i18n="tab_wishlist"></button></li>
        </ul>
    </nav>

    <!-- Favourites that came back in stock (filled by loadRestockAlerts) -->
    <div id="alerts"></div>

    <!-- What's on screen (the section, or the search) and the platform: main platforms as chips,
         the older ones in "Outras"; #consoleFilter holds the choice for the page's script -->
    <div class="section-head">
        <div class="min-w-0">
            <h2 id="section-title" class="section-title"></h2>
            <p id="section-sub" class="section-sub"></p>
        </div>
        <div class="platform-picker" role="group" data-i18n-aria-label="platform">
            <div id="platform-chips" class="d-flex flex-wrap gap-2"></div>
            <select id="more-platforms" class="form-select form-select-sm chip-select d-none" data-i18n-aria-label="more_platforms"></select>
            <select id="consoleFilter" class="d-none" aria-hidden="true" tabindex="-1">
                <option value="" data-i18n="all_platforms"></option>
            </select>
        </div>
    </div>

    <section id="front" class="mb-4">
        <div id="front-loading" class="text-center my-4 d-none"><div class="spinner-border text-primary"></div></div>
        <div id="front-content"></div>
        <p id="front-empty" class="text-body-secondary small d-none mb-0"></p>
    </section>

    <div id="loading" class="text-center my-4 d-none"><div class="spinner-border text-primary"></div></div>
    <p id="empty" class="text-body-secondary d-none" data-i18n="no_results"></p>

    <div id="results"></div>

    <!-- When each store's prices were last updated; ⚠ when a run failed or a store is out of date -->
    <footer class="small text-body-secondary border-top mt-5 pt-3">
        <div id="store-status"></div>
        <!-- IGDB's terms ask for a visible credit where its data is shown -->
        <div class="mt-1"><span data-i18n="igdb_credit"></span> <a href="https://www.igdb.com" target="_blank" rel="noopener">IGDB.com</a></div>
    </footer>
</div>

<script src="/static/pages/index.js"></script>
</body>
</html>
