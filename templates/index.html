<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Price Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .game-card .cover-link { display: block; overflow: hidden; background: #000; }
        .game-card img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; transition: transform .3s ease; }
        .game-card:hover img { transform: scale(1.04); }
        .game-card .card-body { padding: .5rem; font-size: .8rem; }
        /* Every card has the same layout: title always 2 lines tall, platform 1 line,
           extra line (release date, historical low...) 2 lines; longer text ends in "…" */
        .game-title {
            font-size: .85rem; font-weight: 600; line-height: 1.25; margin-bottom: .15rem;
            height: 2.5em;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-platform { line-height: 1.4; height: 1.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-extra {
            line-height: 1.4; height: 2.8em; margin-bottom: .4rem;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .fav-btn {
            position: absolute; top: .4rem; right: .4rem; width: 1.75rem; height: 1.75rem; padding: 0;
            border-radius: 50%; line-height: 1; font-size: 1.05rem;
        }
        /* One button per store, linking to the product on the store's site */
        .offer-btn {
            display: flex; justify-content: space-between; align-items: baseline; gap: .4rem;
            width: 100%; margin-top: .3rem; padding: .25rem .45rem; font-size: .78rem; text-align: left;
        }
        .offer-btn .store { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .offer-btn .price { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 700; }
        .offer-btn .was { font-weight: 400; text-decoration: line-through; opacity: .75; margin-right: .2rem; }
        /* Tabs as solid buttons too (Bootstrap pills are plain text until selected) */
        .nav-pills .nav-link:not(.active) { background: var(--bs-secondary-bg); color: var(--bs-emphasis-color); }
        .nav-pills .nav-link:not(.active):hover { background: var(--bs-tertiary-bg); }
        .discount-badge { position: absolute; top: .4rem; left: .4rem; font-size: .8rem; }
        .release-date { width: 3.2rem; }
        .release-item img { width: 40px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: .25rem; background: #000; }
        .min-w-0 { min-width: 0; }
    </style>
</head>

<body class="bg-body-tertiary">

<div class="container-xxl py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0"><a href="/" onclick="goHome(); return false;" class="link-body-emphasis text-decoration-none">🎮 Game Price Tracker</a></h1>
        <div class="d-flex gap-2">
            <!-- Back to the front page; shown while search results are on screen -->
            <button id="home-btn" onclick="goHome()" class="btn btn-sm btn-primary d-none">🏠 Início</button>
            <button onclick="toggleDark()" class="btn btn-sm btn-secondary" aria-label="Modo escuro">🌙</button>
        </div>
    </div>

    <form class="row g-2 mb-4" onsubmit="handleSearch(event)">
        <div class="col-md-6">
            <input type="text" id="q" class="form-control" placeholder="Ex: resident evil" autofocus>
        </div>
        <div class="col-md-3">
            <select id="consoleFilter" class="form-select" aria-label="Plataforma">
                <option value="">Todas as plataformas</option>
            </select>
        </div>
        <div class="col-md-3 d-grid">
            <button type="submit" class="btn btn-primary">Pesquisar</button>
        </div>
    </form>

    <!-- Favourites that came back in stock (filled by loadRestockAlerts) -->
    <div id="alerts"></div>

    <!-- Front page: the visitor picks what to see; the choice is remembered in this browser -->
    <section id="front" class="mb-4">
        <ul class="nav nav-pills mb-3 gap-1" role="tablist">
            <li class="nav-item"><button class="nav-link" data-tab="discounts" role="tab">🔥 Descontos e melhores preços</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="preorders" role="tab">📦 Pré-reservas</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="releases" role="tab">📅 Calendário de lançamentos</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="catalog" role="tab">📚 Catálogo</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="special" role="tab">💎 Edições especiais</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="favorites" role="tab">⭐ Favoritos</button></li>
        </ul>
        <div id="front-loading" class="text-center my-4 d-none"><div class="spinner-border text-primary"></div></div>
        <div id="front-content"></div>
        <p id="front-empty" class="text-body-secondary small d-none mb-0"></p>
    </section>

    <div id="loading" class="text-center my-4 d-none"><div class="spinner-border text-primary"></div></div>
    <p id="empty" class="text-body-secondary d-none">Nenhum jogo encontrado.</p>

    <div id="results" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 row-cols-xxl-8 g-2"></div>

    <!-- When each store's prices were last updated; ⚠ when a run failed or a store is out of date -->
    <footer id="store-status" class="small text-body-secondary border-top mt-5 pt-3"></footer>
</div>

<script>
const MAX_OFFERS = 3;   // offers shown on a card; the game page has all of them
const eur = new Intl.NumberFormat("pt-PT", { style: "currency", currency: "EUR" });

let currentData = [];
let hasSearched = false;
let stores = {};
let favorites = [];
try { favorites = (JSON.parse(localStorage.getItem("favoriteEditions")) || []).filter(Number.isInteger); } catch (e) {}

function esc(text) {
    const div = document.createElement("div");
    div.textContent = text ?? "";
    return div.innerHTML;
}

function storeName(slug) {
    return stores[slug]?.name || slug;
}

function handleSearch(event) {
    event.preventDefault();
    search();
}

function render(data) {
    const container = document.getElementById("results");
    container.innerHTML = "";

    const selected = document.getElementById("consoleFilter").value;
    const groups = data
        .filter(g => !selected || g.console === selected)
        .sort((a, b) => isFavorite(b) - isFavorite(a));

    document.getElementById("empty").classList.toggle("d-none", groups.length > 0 || !hasSearched);

    groups.forEach(group => container.appendChild(makeCard(group)));
}

// A card: cover, title, platform and up to MAX_OFFERS store prices.
// group = {name, console, platform_name, game_id, edition_id, offers: [...]}
// extraLine: null = no extra line; "" = keep the space, so cards in the same grid line up
function makeCard(group, { coverBadge = "", extraLine = null } = {}) {
    // in stock first, then cheapest
    const offers = [...group.offers].sort((a, b) => (b.in_stock - a.in_stock) || (a.price - b.price));
    const best = offers[0];
    const gameUrl = `/game/${group.game_id}`;

    // Cheapest store in stock in green, the others outlined; each opens the product on the store's site
    const rows = offers.slice(0, MAX_OFFERS).map((o, i) => `
        <a href="${esc(o.url)}" target="_blank" rel="noopener"
           class="btn offer-btn ${i === 0 && o.in_stock ? "btn-success" : "btn-secondary"} ${o.in_stock ? "" : "opacity-75"}"
           title="Ver na ${esc(storeName(o.store))}">
            <span class="store">${esc(storeName(o.store))}${o.condition === "used" ? " · Usado" : ""}${o.in_stock ? "" : " · Esgotado"}</span>
            <span class="price">
                ${o.discount_percent && !coverBadge ? `<span class="badge text-bg-danger">-${o.discount_percent}%</span>` : ""}
                ${o.was_price ? `<span class="was">${eur.format(o.was_price)}</span>` : ""}${eur.format(o.price)}
            </span>
        </a>`).join("");

    const more = offers.length > MAX_OFFERS
        ? `<a href="${gameUrl}" class="btn btn-primary offer-btn justify-content-center">Ver todas as lojas (+${offers.length - MAX_OFFERS})</a>`
        : offers.length ? "" : '<div class="small text-body-secondary">Sem ofertas de momento</div>';

    const col = document.createElement("div");
    col.className = "col";
    col.innerHTML = `
        <div class="card h-100 shadow-sm overflow-hidden game-card">
            <div class="position-relative">
                <a href="${gameUrl}" class="cover-link"><img src="${esc(best?.image || group.image || "")}" alt="" loading="lazy"></a>
                ${coverBadge}
                <button type="button" class="btn btn-light fav-btn shadow-sm"
                    aria-label="Favorito" aria-pressed="${isFavorite(group)}">${isFavorite(group) ? "★" : "☆"}</button>
            </div>
            <div class="card-body d-flex flex-column">
                <a href="${gameUrl}" class="link-body-emphasis text-decoration-none game-title" title="${esc(group.name)}">${esc(group.name)}</a>
                <div class="text-body-secondary small card-platform">${esc(group.platform_name || group.console)}</div>
                ${extraLine === null ? '<div class="mb-2"></div>' : `<div class="small card-extra">${extraLine}</div>`}
                <div class="mt-auto">${rows}${more}</div>
            </div>
        </div>`;
    col.querySelector(".fav-btn").onclick = () => toggleFavorite(group);
    return col;
}

// ---------------------------------------------------------------------------
// Front page tabs
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Catalogue tabs: every edition in stock (or only special editions), 48 at a time,
// filtered by the platform selector on the server, sortable
// ---------------------------------------------------------------------------

const CATALOG_PAGE = 48;
let catalogSort = "name";
try { catalogSort = localStorage.getItem("catalogSort") || "name"; } catch (e) {}

// /?tab=catalog&page=3 opens on that page (bookmarks, the game page's back button)
let pageFromUrl = Number(new URLSearchParams(location.search).get("page")) || 1;

function catalogTab(special, empty) {
    return {
        platformAware: true,
        paged: true,
        load: platform => {
            const page = pageFromUrl;
            pageFromUrl = 1;    // only for the first load
            return loadCatalogPage(special, platform, page);
        },
        render: renderCatalog,
        empty,
    };
}

async function showCatalogPage(page) {
    const data = frontData[frontTab];
    frontData[frontTab] = await loadCatalogPage(data.special, data.platform, page);
    setPageUrl(page > 1 ? `/?tab=${frontTab}&page=${page}` : `/?tab=${frontTab}`);
    renderFront();
    document.getElementById("front").scrollIntoView({ block: "start" });
}

// « Anterior  1 … 4 5 [6] 7 8 … 75  Seguinte »  (solid buttons, current page in blue)
function pagination(page, pages) {
    const nav = document.createElement("nav");
    nav.className = "d-flex flex-wrap justify-content-center gap-1 mt-4";
    nav.setAttribute("aria-label", "Páginas");
    if (pages <= 1) return nav;

    const shown = new Set([1, pages]);
    for (let p = page - 2; p <= page + 2; p++) if (p >= 1 && p <= pages) shown.add(p);
    const numbers = [...shown].sort((a, b) => a - b);

    const button = (label, target, { current = false, disabled = false } = {}) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = `btn btn-sm ${current ? "btn-primary" : "btn-secondary"}`;
        b.textContent = label;
        b.disabled = disabled;
        if (current) b.setAttribute("aria-current", "page");
        if (!disabled && !current) b.onclick = () => showCatalogPage(target);
        return b;
    };

    nav.appendChild(button("« Anterior", page - 1, { disabled: page === 1 }));
    numbers.forEach((p, i) => {
        if (i > 0 && p - numbers[i - 1] > 1) {
            const gap = document.createElement("span");
            gap.className = "px-1 align-self-center text-body-secondary";
            gap.textContent = "…";
            nav.appendChild(gap);
        }
        nav.appendChild(button(String(p), p, { current: p === page }));
    });
    nav.appendChild(button("Seguinte »", page + 1, { disabled: page === pages }));
    return nav;
}

async function loadCatalogPage(special, platform, page) {
    const params = new URLSearchParams({ sort: catalogSort, page, per_page: CATALOG_PAGE });
    if (platform) params.set("platform", platform);
    if (special) params.set("editions", "special");
    const data = await fetch(`/api/games/catalog?${params}`).then(r => r.json());
    return { ...data, special, platform };
}

function renderCatalog(data) {
    const wrap = document.createElement("div");
    wrap.innerHTML = `
        <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
            <span class="small text-body-secondary me-auto">${data.total.toLocaleString("pt-PT")}
                ${data.special ? "edições especiais" : "edições"} em stock · página ${data.page} de ${data.pages}</span>
            <label class="small text-body-secondary" for="catalog-sort">Ordenar:</label>
            <select id="catalog-sort" class="form-select form-select-sm w-auto">
                <option value="name">Nome (A–Z)</option>
                <option value="price_asc">Preço: mais barato primeiro</option>
                <option value="price_desc">Preço: mais caro primeiro</option>
            </select>
        </div>`;

    const select = wrap.querySelector("#catalog-sort");
    select.value = catalogSort;
    select.onchange = async () => {
        catalogSort = select.value;
        try { localStorage.setItem("catalogSort", catalogSort); } catch (e) {}
        await showCatalogPage(1);
    };

    // Games not out yet: "Pré-reserva" on the cover, release date next to the platform
    const grid = cardGrid();
    data.groups.forEach(g => {
        if (!g.is_preorder) return grid.appendChild(makeCard(g));
        const card = { ...g, platform_name: `${g.platform_name} · 📅 ${releaseLabel(g.release_date, g.date_is_estimate)}` };
        grid.appendChild(makeCard(card, {
            coverBadge: `<span class="badge text-bg-primary discount-badge">Pré-reserva</span>`,
        }));
    });
    wrap.appendChild(grid);
    wrap.appendChild(pagination(data.page, data.pages));
    return wrap;
}

const FRONT_TABS = {
    discounts: {
        // Real discounts need 30 days of history; until there are some, show the biggest
        // price gaps between stores (clearly labelled as a comparison, not a discount)
        // Only the top 12 are loaded, so the platform filter is applied by the server
        // (filtering 12 games here could leave almost nothing)
        platformAware: true,
        load: async platform => {
            const query = platform ? `?platform=${encodeURIComponent(platform)}` : "";
            const discounts = await fetch(`/api/discounts/featured${query}`).then(r => r.json());
            if (discounts.length) return discounts;
            const deals = await fetch(`/api/deals${query}`).then(r => r.json());
            return deals.map(d => ({ ...d, isStoreDeal: true }));
        },
        render: renderDiscounts,
        empty: "Ainda sem descontos para mostrar. Só contam descontos reais: o preço tem de estar abaixo "
             + "do mais baixo dos 30 dias anteriores, por isso os primeiros aparecem após um mês de histórico.",
    },
    preorders: { url: "/api/preorders", render: renderPreorders, empty: "Sem jogos em pré-reserva de momento." },
    releases: { url: "/api/releases", render: renderReleases, empty: "Ainda sem datas de lançamento anunciadas." },
    catalog: catalogTab(false, "Sem jogos em stock para esta plataforma."),
    special: catalogTab(true, "Sem edições especiais em stock para esta plataforma."),
    favorites: {
        // the list changes as the visitor stars games, so it's fetched every time
        url: () => `/api/games/editions?ids=${favorites.join(",")}`,
        fresh: true,
        render: renderFavorites,
        empty: "Ainda não tens favoritos. Carrega na ☆ de um jogo para o acompanhares aqui.",
    },
};
const frontData = {};      // tab → data, loaded once per visit
const frontDataPlatform = {};   // tab → platform its data was loaded for (platform-aware tabs)
// Open tab: /?tab=releases if given (shareable links), else the visitor's last choice
let frontTab = "discounts";
try { frontTab = FRONT_TABS[localStorage.getItem("frontTab")] ? localStorage.getItem("frontTab") : "discounts"; } catch (e) {}
const tabFromUrl = new URLSearchParams(location.search).get("tab");
if (FRONT_TABS[tabFromUrl]) frontTab = tabFromUrl;

const MONTHS = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho",
                "agosto", "setembro", "outubro", "novembro", "dezembro"];
const WEEKDAYS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];

// "2026-10-15" → Date at local midnight (new Date("2026-10-15") would be UTC)
function parseDay(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    return new Date(y, m - 1, d);
}

function releaseLabel(iso, isEstimate) {
    if (!iso) return "Data por anunciar";
    const day = parseDay(iso);
    if (isEstimate) return `Data por anunciar (${day.getFullYear()})`;
    return `${day.getDate()} ${MONTHS[day.getMonth()].slice(0, 3)} ${day.getFullYear()}`;
}

// Keep the address bar in step with what's on screen (/?q=… or /?tab=…), and remember it
// for this browser tab so the game page's back button returns exactly here
function setPageUrl(url) {
    history.replaceState(null, "", url);
    try { sessionStorage.setItem("lastListPage", url); } catch (e) {}
}

async function selectFrontTab(tab) {
    frontTab = tab;
    try { localStorage.setItem("frontTab", tab); } catch (e) {}
    document.querySelectorAll("[data-tab]").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === tab);
        b.setAttribute("aria-selected", b.dataset.tab === tab);
    });

    const config = FRONT_TABS[tab];
    const platform = document.getElementById("consoleFilter").value;
    const stale = config.platformAware && frontDataPlatform[tab] !== platform;
    if (tab === "favorites" && !favorites.length) {
        frontData[tab] = [];
    } else if (!frontData[tab] || config.fresh || stale) {
        document.getElementById("front-content").innerHTML = "";
        document.getElementById("front-empty").classList.add("d-none");
        document.getElementById("front-loading").classList.remove("d-none");
        try {
            if (config.load) {
                frontData[tab] = await config.load(platform);
                frontDataPlatform[tab] = platform;
            } else {
                const url = typeof config.url === "function" ? config.url() : config.url;
                frontData[tab] = await fetch(url).then(r => r.json());
            }
        } catch (e) {
            console.error("Erro a carregar", tab, e);
            frontData[tab] = [];
        }
        document.getElementById("front-loading").classList.add("d-none");
        if (tab !== frontTab) return;   // the visitor switched tabs while this was loading
    }

    // Address bar: /?tab=… (+ &page=… on catalogue pages), not while a search is on screen
    if (!document.getElementById("q").value.trim()) {
        const page = config.paged ? frontData[tab]?.page || 1 : 1;
        setPageUrl(page > 1 ? `/?tab=${tab}&page=${page}` : `/?tab=${tab}`);
    }
    renderFront();
}

// The platform filter applies to the front page too
function renderFront() {
    const config = FRONT_TABS[frontTab];
    const content = document.getElementById("front-content");
    const empty = document.getElementById("front-empty");
    content.innerHTML = "";

    // Catalogue tabs: one page of results, already filtered by platform on the server
    if (config.paged) {
        const data = frontData[frontTab];
        const hasGroups = Boolean(data?.groups?.length);
        if (hasGroups) content.appendChild(config.render(data));
        empty.textContent = config.empty;
        empty.classList.toggle("d-none", hasGroups);
        return;
    }

    const selected = document.getElementById("consoleFilter").value;
    const items = (frontData[frontTab] || []).filter(i => !selected || (i.console || i.platform) === selected);

    if (items.length) content.appendChild(config.render(items));

    empty.textContent = selected && frontData[frontTab]?.length ? "Nada para esta plataforma." : FRONT_TABS[frontTab].empty;
    empty.classList.toggle("d-none", items.length > 0);
}

function cardGrid() {
    const grid = document.createElement("div");
    grid.className = "row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 row-cols-xxl-8 g-2";
    return grid;
}

// Favourite editions with all their offers and the historical low (new copies, in stock)
function renderFavorites(groups) {
    const grid = cardGrid();
    groups.forEach(g => {
        const low = g.lowest_price;
        const best = g.offers.find(o => o.in_stock && o.condition === "new");
        const lines = [];
        if (g.offers.some(o => o.restocked_at)) {
            lines.push('<span class="badge text-bg-warning">🔔 De volta ao stock</span>');
        }
        // "Lowest ever" only means something after a while (same 30 days as the discount rule)
        const trackedDays = low ? (Date.now() - new Date(low.tracked_since)) / 86400000 : 0;
        if (low && best && best.price <= low.price && trackedDays >= 30) {
            lines.push('<span class="badge text-bg-success">★ Preço mais baixo de sempre</span>');
        } else if (low) {
            lines.push(`<span class="text-body-secondary">Mínimo histórico: ${eur.format(low.price)}</span>`);
        }
        grid.appendChild(makeCard(g, { extraLine: lines.join(" ") }));
    });
    return grid;
}

// ---------------------------------------------------------------------------
// Back-in-stock alerts for favourites
// The server flags offers that went from sold out to in stock recently (restocked_at);
// dismissed alerts are remembered per restock, so a later restock alerts again.
// ---------------------------------------------------------------------------

function restockKey(o) {
    return `${o.offer_id}@${o.restocked_at}`;
}

function dismissedRestocks() {
    try { return new Set(JSON.parse(localStorage.getItem("dismissedRestocks")) || []); } catch (e) { return new Set(); }
}

async function loadRestockAlerts() {
    if (!favorites.length) return;
    try {
        const groups = await fetch(FRONT_TABS.favorites.url()).then(r => r.json());
        frontData.favorites = groups;
        const dismissed = dismissedRestocks();
        const alerts = groups.flatMap(g => g.offers
            .filter(o => o.restocked_at && !dismissed.has(restockKey(o)))
            .map(o => ({ group: g, offer: o })));
        renderRestockAlerts(alerts);
    } catch (e) {
        console.error("Erro a verificar stock dos favoritos:", e);
    }
}

function renderRestockAlerts(alerts) {
    const box = document.getElementById("alerts");
    if (!alerts.length) { box.innerHTML = ""; return; }

    const items = alerts.map(({ group, offer }) => `
        <li class="d-flex flex-wrap align-items-center gap-2 py-1">
            <a href="/game/${group.game_id}" class="fw-semibold link-body-emphasis">${esc(group.name)}</a>
            <span class="text-body-secondary small">${esc(group.platform_name)}</span>
            <span>· ${esc(storeName(offer.store))} · <strong>${eur.format(offer.price)}</strong></span>
            <a href="${esc(offer.url)}" target="_blank" rel="noopener" class="btn btn-sm btn-success py-0">Ver na loja</a>
        </li>`).join("");

    box.innerHTML = `
        <div class="alert alert-warning alert-dismissible mb-4" role="status">
            <div class="fw-semibold mb-1">🔔 ${alerts.length === 1 ? "Um favorito voltou" : `${alerts.length} favoritos voltaram`} ao stock</div>
            <ul class="list-unstyled mb-0">${items}</ul>
            <button type="button" class="btn-close" aria-label="Dispensar"></button>
        </div>`;

    box.querySelector(".btn-close").onclick = () => {
        const dismissed = dismissedRestocks();
        alerts.forEach(({ offer }) => dismissed.add(restockKey(offer)));
        try { localStorage.setItem("dismissedRestocks", JSON.stringify([...dismissed])); } catch (e) {}
        box.innerHTML = "";
    };
}

// Biggest real discounts (from our own price history, never the store's crossed-out price),
// or, while there are none yet, the biggest price gaps between stores
function renderDiscounts(offers) {
    const wrap = document.createElement("div");
    const storeDeals = offers[0]?.isStoreDeal;

    if (storeDeals) {
        wrap.innerHTML = `
            <p class="small text-body-secondary mb-3">
                <strong>Melhores preços entre lojas.</strong> Ainda não há descontos reais para mostrar
                (o preço tem de estar abaixo do mais baixo dos 30 dias anteriores, e o histórico começou
                a 1 de outubro). Entretanto, estes jogos estão bem mais baratos numa loja do que na seguinte.
            </p>`;
    }

    const grid = cardGrid();
    offers.forEach(o => {
        const name = o.edition_key === "" ? o.title : `${o.title} — ${o.edition}`;
        // o.offers: this store's offer plus the other stores' prices, each shown as a button
        const group = { name, console: o.platform, platform_name: o.platform_name, game_id: o.game_id,
                        edition_id: o.edition_id, offers: o.offers || [o] };
        grid.appendChild(makeCard(group, {
            coverBadge: storeDeals
                ? `<span class="badge text-bg-success discount-badge">-${o.savings_percent}% vs outras lojas</span>`
                : `<span class="badge text-bg-danger discount-badge">-${o.discount_percent}%</span>`,
        }));
    });
    wrap.appendChild(grid);
    return wrap;
}

function renderPreorders(groups) {
    const grid = cardGrid();
    groups.forEach(g => grid.appendChild(makeCard(g, {
        coverBadge: `<span class="badge text-bg-primary discount-badge">Pré-reserva</span>`,
        extraLine: `📅 ${esc(releaseLabel(g.release_date, g.date_is_estimate))}`,
    })));
    return grid;
}

// Agenda: month → day → games. "31/12" estimates go to a final "to be announced" group.
function renderReleases(games) {
    const wrap = document.createElement("div");
    const today = new Date(); today.setHours(0, 0, 0, 0);

    const dated = games.filter(g => !g.date_is_estimate);
    const estimated = games.filter(g => g.date_is_estimate);

    let month = null, dayList = null, dayKey = null;
    dated.forEach(g => {
        const day = parseDay(g.release_date);
        const monthKey = `${day.getFullYear()}-${day.getMonth()}`;
        if (monthKey !== month) {
            month = monthKey;
            wrap.insertAdjacentHTML("beforeend",
                `<h3 class="h6 text-uppercase text-body-secondary mt-4 mb-2">${MONTHS[day.getMonth()]} ${day.getFullYear()}</h3>`);
        }
        if (g.release_date !== dayKey) {
            dayKey = g.release_date;
            const isToday = day.getTime() === today.getTime();
            const row = document.createElement("div");
            row.className = "release-day d-flex gap-3 py-2 border-bottom";
            row.innerHTML = `
                <div class="release-date text-center flex-shrink-0">
                    <div class="fs-4 fw-bold lh-1">${day.getDate()}</div>
                    <div class="small text-body-secondary">${WEEKDAYS[day.getDay()]}</div>
                    ${isToday ? '<span class="badge text-bg-success">Hoje</span>' : ""}
                </div>
                <div class="release-games flex-grow-1 row row-cols-1 row-cols-md-2 row-cols-xl-3 g-2"></div>`;
            wrap.appendChild(row);
            dayList = row.querySelector(".release-games");
        }
        dayList.appendChild(releaseItem(g));
    });

    if (estimated.length) {
        wrap.insertAdjacentHTML("beforeend", `<h3 class="h6 text-uppercase text-body-secondary mt-4 mb-2">Data por anunciar</h3>`);
        const list = document.createElement("div");
        list.className = "row row-cols-1 row-cols-md-2 row-cols-xl-3 g-2";
        estimated.forEach(g => list.appendChild(releaseItem(g, `${parseDay(g.release_date).getFullYear()}`)));
        wrap.appendChild(list);
    }
    return wrap;
}

function releaseItem(g, note = "") {
    const col = document.createElement("div");
    col.className = "col";
    const gameUrl = `/game/${g.game_id}`;
    const editions = g.editions > 1 ? ` · ${g.editions} edições` : "";
    col.innerHTML = `
        <div class="d-flex gap-2 align-items-center release-item">
            <a href="${gameUrl}" class="flex-shrink-0"><img src="${esc(g.image || "")}" alt="" loading="lazy"></a>
            <div class="flex-grow-1 min-w-0">
                <a href="${gameUrl}" class="link-body-emphasis text-decoration-none fw-semibold d-block text-truncate"
                   title="${esc(g.title)}">${esc(g.title)}</a>
                <div class="small text-body-secondary">${esc(g.platform_name)}${editions}${note ? ` · ${esc(note)}` : ""}</div>
            </div>
            ${g.best_price != null ? `<a href="${esc(g.url)}" target="_blank" rel="noopener"
                class="btn btn-sm btn-success flex-shrink-0" title="Ver na ${esc(storeName(g.store))}">
                ${eur.format(g.best_price)}<span class="d-none d-sm-inline"> · ${esc(storeName(g.store))}</span></a>` : ""}
        </div>`;
    return col;
}

function showFront(show) {
    document.getElementById("front").classList.toggle("d-none", !show);
    document.getElementById("home-btn").classList.toggle("d-none", show);
}

// Clear the search and show the front page tabs again
function goHome() {
    document.getElementById("q").value = "";
    search();
    window.scrollTo({ top: 0 });
}

document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => selectFrontTab(b.dataset.tab)));

let isSearching = false;

async function search() {
    const query = document.getElementById("q").value.trim();
    if (isSearching) return;

    // Empty search: back to the front page with the featured discounts
    if (!query) {
        hasSearched = false;
        currentData = [];
        document.getElementById("results").innerHTML = "";
        document.getElementById("empty").classList.add("d-none");
        setPageUrl(`/?tab=${frontTab}`);
        showFront(true);
        return;
    }

    isSearching = true;
    showFront(false);

    document.getElementById("loading").classList.remove("d-none");
    document.getElementById("empty").classList.add("d-none");
    document.getElementById("results").innerHTML = "";

    setPageUrl(`/?q=${encodeURIComponent(query)}`);

    try {
        const res = await fetch(`/search?q=${encodeURIComponent(query)}`);
        currentData = await res.json();
        hasSearched = true;
        render(currentData);
    } catch (err) {
        console.error("Erro na pesquisa:", err);
    }

    document.getElementById("loading").classList.add("d-none");
    isSearching = false;
}

document.getElementById("consoleFilter").addEventListener("change", () => {
    if (hasSearched) return render(currentData);
    // Platform-aware tabs ask the server again; the others filter what they already have
    FRONT_TABS[frontTab].platformAware ? selectFrontTab(frontTab) : renderFront();
});

// Platforms and store names come from the API, so new ones appear without editing this page
async function loadFilters() {
    try {
        const [platforms, storeList] = await Promise.all([
            fetch("/api/platforms").then(r => r.json()),
            fetch("/api/stores").then(r => r.json()),
        ]);
        const select = document.getElementById("consoleFilter");
        platforms.forEach(p => select.add(new Option(p.name, p.code)));
        storeList.forEach(s => stores[s.slug] = s);
        renderStoreStatus(storeList);
    } catch (e) {
        console.error("Erro a carregar filtros:", e);
    }
}

function timeAgo(iso) {
    const hours = (Date.now() - new Date(iso)) / 3600000;
    if (hours < 1) return "há menos de 1 h";
    if (hours < 48) return `há ${Math.floor(hours)} h`;
    return `há ${Math.floor(hours / 24)} dias`;
}

// "Preços atualizados: CSTech há 3 h · Mega Mania há 3 h · ⚠ Press Start: falhou há 1 h"
function renderStoreStatus(storeList) {
    const parts = storeList.map(s => {
        const problem = s.last_status === "failed" ? "a última atualização falhou"
                      : s.last_status === "warning" ? "a última atualização teve um problema"
                      : s.is_stale ? "desatualizada" : null;
        const when = s.last_updated ? `atualizado ${timeAgo(s.last_updated)}` : "nunca atualizado";
        if (!problem) return `<span>${esc(s.name)} ${when}</span>`;
        return `<span class="text-warning-emphasis" title="${esc(s.last_error || "")}">⚠ ${esc(s.name)}: ${problem} (${when})</span>`;
    });
    document.getElementById("store-status").innerHTML =
        `Preços das lojas, atualizados uma vez por dia: ${parts.join(" · ")}`;
}

// Favourites are game editions, saved in this browser by edition id
function isFavorite(group) {
    return favorites.includes(group.edition_id);
}

function toggleFavorite(group) {
    const id = group.edition_id;
    favorites = favorites.includes(id) ? favorites.filter(f => f !== id) : [...favorites, id];
    try { localStorage.setItem("favoriteEditions", JSON.stringify(favorites)); } catch (e) {}

    if (hasSearched) return render(currentData);
    if (frontTab === "favorites") frontData.favorites = (frontData.favorites || []).filter(g => favorites.includes(g.edition_id));
    renderFront();
}

function toggleDark() {
    const next = document.documentElement.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-bs-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
}

function savedTheme() {
    let theme = null;
    try { theme = localStorage.getItem("theme"); } catch (e) {}
    return theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}

document.documentElement.setAttribute("data-bs-theme", savedTheme());

// /?q=zelda opens with that search, so searches can be bookmarked or shared
loadFilters().then(() => {
    const q = new URLSearchParams(location.search).get("q");
    if (q) {
        document.getElementById("q").value = q;
        search();
    }
    // after loadFilters, so the cards show store names
    selectFrontTab(frontTab);
    loadRestockAlerts();
});
</script>
</body>
</html>
