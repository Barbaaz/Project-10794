<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Price Tracker</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- installable on a phone (static/manifest.webmanifest, static/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2346d0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="/static/common.css" rel="stylesheet">
    <script src="/static/common.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/market.js"></script>
</head>
<body class="bg-body-tertiary">

<!-- The same header on every page (static/common.js fills the account area) -->
<header class="site-header bg-body border-bottom mb-4">
    <div class="container-xxl d-flex align-items-center gap-2 py-2">
        <a href="/" class="site-brand link-body-emphasis text-decoration-none">🎮 <span>Game Price Tracker</span></a>
        <div class="header-tools ms-auto d-flex align-items-center gap-1">
            <div id="account-area" class="d-flex gap-1 align-items-center"></div>
            <div id="lang-switch" class="btn-group header-setting" role="group" data-i18n-aria-label="language"></div>
            <button type="button" data-toggle-dark class="btn btn-sm btn-secondary header-setting"
                    data-i18n-aria-label="dark_mode" data-i18n-title="dark_mode">🌙</button>
        </div>
    </div>
</header>

<div class="container pb-4" style="max-width: 1000px;">

    <h1 class="h3 mb-3" data-i18n="mod_title"></h1>
    <div id="not-allowed" class="alert alert-warning d-none" data-i18n="mod_not_allowed"></div>

    <div id="tools" class="d-none">
        <ul class="nav nav-pills mb-3 scroll-tabs" role="tablist">
            <li class="nav-item" role="presentation"><button class="nav-link active" data-tab="reports" role="tab" data-i18n="mod_tab_reports"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="problems" role="tab" data-i18n="mod_tab_problems"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="matches" role="tab" data-i18n="mod_tab_matches"></button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" data-tab="log" role="tab" data-i18n="mod_tab_log"></button></li>
            <li class="nav-item d-none" id="staff-tab" role="presentation"><button class="nav-link" data-tab="staff" role="tab" data-i18n="mod_tab_staff"></button></li>
        </ul>
        <div id="message" class="alert d-none py-2 small" role="alert"></div>

        <!-- Open reports, one card per reported thing -->
        <section id="tab-reports" role="tabpanel">
            <div id="reports" class="d-flex flex-column gap-3"></div>
            <p id="no-reports" class="text-body-secondary d-none" data-i18n="mod_no_reports"></p>
        </section>

        <!-- Purchases where the buyer reported a problem -->
        <section id="tab-problems" role="tabpanel" class="d-none">
            <div id="problems" class="list-group"></div>
            <p id="no-problems" class="text-body-secondary d-none" data-i18n="mod_no_problems"></p>
            <div id="conversation" class="card mt-3 d-none"><div class="card-body"></div></div>
        </section>

        <section id="tab-log" role="tabpanel" class="d-none">
            <div class="table-responsive">
                <table class="table table-sm small">
                    <thead><tr><th data-i18n="col_date"></th><th data-i18n="mod_col_moderator"></th>
                        <th data-i18n="mod_col_action"></th><th data-i18n="mod_col_target"></th><th data-i18n="mod_note"></th></tr></thead>
                    <tbody id="log"></tbody>
                </table>
            </div>
        </section>

        <!-- Admins only: name or remove moderators (admins are made from the command line) -->
        <!-- Wrong matches: move store products to the right edition (pinned there) -->
        <section id="tab-matches" role="tabpanel" class="d-none">
            <p class="small text-body-secondary" data-i18n="match_intro"></p>
            <form id="match-search" class="input-group input-group-sm mb-3" style="max-width: 32rem;" role="search">
                <input name="q" required class="form-control" data-i18n-placeholder="match_search_placeholder"
                       data-i18n-aria-label="match_search_placeholder">
                <button class="btn btn-primary" data-i18n="search"></button>
            </form>
            <div id="match-results" class="d-flex flex-column gap-3 mb-4"></div>
            <!-- Two games on one platform matched to the same IGDB entry: merge them or say they differ -->
            <h2 class="h6" data-i18n="dup_title"></h2>
            <p class="small text-body-secondary" data-i18n="dup_intro"></p>
            <ul id="duplicates" class="list-group list-group-flush small mb-4"></ul>
            <h2 class="h6" data-i18n="match_pins"></h2>
            <ul id="pins" class="list-group list-group-flush small"></ul>
        </section>

        <section id="tab-staff" role="tabpanel" class="d-none">
            <ul id="staff" class="list-group mb-3"></ul>
            <form id="staff-form" class="row g-2 align-items-end" style="max-width: 32rem;">
                <div class="col">
                    <label for="staff-username" class="form-label small" data-i18n="mod_username"></label>
                    <input id="staff-username" name="username" required class="form-control form-control-sm">
                </div>
                <div class="col-auto">
                    <button name="role" value="moderator" class="btn btn-sm btn-primary" data-i18n="mod_make_moderator"></button>
                </div>
            </form>
        </section>
    </div>
</div>

<script src="/static/pages/admin.js"></script>
</body>
</html>
