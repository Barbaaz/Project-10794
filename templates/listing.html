<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Price Tracker</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- installable on a phone (static/manifest.webmanifest, static/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2346d0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="/static/common.css" rel="stylesheet">
    <script src="/static/common.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/market.js"></script>
    <style>
        .main-photo { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: var(--bs-secondary-bg); border-radius: .5rem; }
        .thumbs { display: flex; gap: .4rem; overflow-x: auto; }
        .thumbs button { padding: 0; border: 2px solid transparent; border-radius: .375rem; background: none; flex-shrink: 0; }
        .thumbs button[aria-current="true"] { border-color: var(--bs-primary); }
        .thumbs img { width: 80px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: .25rem; display: block; }
        .owner-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: .4rem; }
        .owner-photos figure { position: relative; margin: 0; }
        .owner-photos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: .25rem; }
        .owner-photos button { position: absolute; top: .2rem; right: .2rem; }
    </style>
</head>
<body class="bg-body-tertiary" data-listing-id="{{ listing_id }}">

{% include "_header.html" %}

<div class="container pb-4" style="max-width: 1000px;">
    <div class="mb-3"><a href="#" id="game-link" class="btn btn-sm btn-secondary d-none"></a></div>

    <div id="loading" class="text-center my-5"><div class="spinner-border text-primary"></div></div>
    <div id="error" class="alert alert-warning d-none"></div>

    <div id="listing" class="row g-4 d-none">
        <div class="col-md-7">
            <img id="main-photo" class="main-photo mb-2" alt="">
            <div id="thumbs" class="thumbs"></div>
        </div>
        <div class="col-md-5">
            <h1 id="title" class="h4 mb-1"></h1>
            <div id="subtitle" class="text-body-secondary mb-3"></div>
            <div class="d-flex align-items-center gap-2 mb-2">
                <span id="price" class="fs-2 fw-bold"></span><span id="status"></span>
            </div>
            <div id="compare" class="small mb-3"></div>
            <dl class="row small mb-3">
                <dt class="col-5 text-body-secondary" data-i18n="sell_condition"></dt><dd id="condition" class="col-7"></dd>
                <dt class="col-5 text-body-secondary" data-i18n="listing_seller"></dt><dd id="seller" class="col-7"></dd>
                <dt class="col-5 text-body-secondary" data-i18n="listing_published"></dt><dd id="published" class="col-7"></dd>
            </dl>
            <p id="description" class="mb-3" style="white-space: pre-line;"></p>

            <!-- Buyers: talk to the seller / ask to buy (app/services/chat_service.py) -->
            <div id="buyer-actions" class="d-flex gap-2 mb-3 d-none">
                <button type="button" id="buy-btn" class="btn btn-success flex-fill" data-i18n="listing_buy"></button>
                <button type="button" id="message-btn" class="btn btn-primary flex-fill" data-i18n="listing_message"></button>
            </div>
            <div id="buyer-error" class="alert alert-warning d-none py-2 small" role="alert"></div>
            <div id="report" class="mb-3"></div>

            <!-- Only the seller sees this -->
            <div id="removed-notice" class="alert alert-danger d-none small" role="status" data-i18n="listing_removed_by_moderator"></div>
            <section id="owner" class="card d-none">
                <div class="card-body">
                    <h2 class="h6" data-i18n="listing_manage"></h2>
                    <form id="price-form" class="input-group input-group-sm mb-2">
                        <input id="new-price" type="number" min="0.5" max="10000" step="0.01" class="form-control"
                               data-i18n-aria-label="sell_price">
                        <span class="input-group-text">€</span>
                        <button class="btn btn-primary" data-i18n="listing_change_price"></button>
                    </form>
                    <div id="status-buttons" class="d-flex flex-wrap gap-1 mb-3"></div>
                    <div id="owner-photos" class="owner-photos mb-2"></div>
                    <label class="btn btn-sm btn-secondary">
                        <span data-i18n="listing_add_photos"></span>
                        <input id="add-photos" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
                    </label>
                    <div id="owner-error" class="alert alert-danger d-none py-1 px-2 small mt-2" role="alert"></div>
                </div>
            </section>
        </div>
    </div>
</div>

<script src="/static/pages/listing.js"></script>
</body>
</html>
