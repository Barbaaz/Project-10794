<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game Price Tracker</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- installable on a phone (static/manifest.webmanifest, static/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2346d0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="/static/common.css" rel="stylesheet">
    <script src="/static/common.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/market.js"></script>
    <style>
        .chat-list .list-group-item img, .chat-header img { width: 48px; aspect-ratio: 4 / 3; object-fit: cover; border-radius: .25rem; background: var(--bs-secondary-bg); }
        .chat-list .preview { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .chat-messages { height: 52vh; overflow-y: auto; display: flex; flex-direction: column; gap: .4rem; padding: .75rem;
                         background: var(--bs-tertiary-bg); border-radius: .5rem; }
        .bubble { max-width: 75%; padding: .45rem .7rem; border-radius: .75rem; white-space: pre-line; overflow-wrap: anywhere; }
        .bubble.mine { align-self: flex-end; background: var(--bs-primary); color: #fff; border-bottom-right-radius: .2rem; }
        .bubble.theirs { align-self: flex-start; background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-bottom-left-radius: .2rem; }
        .bubble .time { display: block; font-size: .7rem; opacity: .85; margin-top: .15rem; }
        .bubble.mine .time { opacity: 1; }
        .chat-list .active .preview { opacity: 1 !important; }
        .bubble .photos { display: flex; flex-wrap: wrap; gap: .25rem; margin-bottom: .2rem; white-space: normal; }
        .bubble .photos img, .chosen-photos img { width: 96px; height: 72px; object-fit: cover; border-radius: .4rem; background: var(--bs-secondary-bg); }
        .chosen-photos img { width: 56px; height: 42px; }
        .site-message { align-self: center; font-size: .8rem; color: var(--bs-secondary-color); text-align: center; }
        .star-input { display: inline-flex; flex-direction: row-reverse; gap: .1rem; }
        .star-input input { position: absolute; opacity: 0; }
        .star-input label { font-size: 1.6rem; line-height: 1; cursor: pointer; color: var(--bs-secondary-color); }
        .star-input input:checked ~ label, .star-input label:hover, .star-input label:hover ~ label { color: #f5b301; }
        .star-input input:focus-visible + label { outline: 2px solid var(--bs-primary); border-radius: .2rem; }
        /* On a phone an open conversation takes the screen (the list is one tap away, "Conversas") */
        @media (max-width: 767.98px) {
            .chat-open .chat-list-col { display: none; }
            .chat-messages { height: 58vh; height: 58dvh; }
        }
    </style>
</head>
<body class="bg-body-tertiary">

{% include "_header.html" %}

<div class="container-xl pb-4">

    <h1 class="h4 mb-3" data-i18n="messages"></h1>

    <div id="chat-layout" class="row g-3">
        <div class="col-md-4 chat-list-col">
            <div id="chat-list" class="list-group chat-list"></div>
            <p id="no-chats" class="small text-body-secondary d-none" data-i18n="no_conversations"></p>
        </div>
        <div class="col-md-8">
            <section id="chat" class="card shadow-sm d-none">
                <div class="card-body">
                    <button type="button" id="back-to-list" class="btn btn-sm btn-link px-0 mb-2 d-md-none"
                            data-i18n="chat_back"></button>
                    <div class="chat-header d-flex align-items-center gap-2 mb-2">
                        <img id="chat-thumb" alt="">
                        <div class="me-auto">
                            <a id="chat-listing" class="fw-semibold link-body-emphasis"></a>
                            <div id="chat-with" class="small text-body-secondary"></div>
                        </div>
                        <span id="chat-status" class="badge"></span>
                    </div>
                    <div id="chat-steps" class="d-flex flex-wrap gap-1 mb-2"></div>
                    <p id="step-hint" class="small text-body-secondary mb-2"></p>
                    <!-- After a completed purchase: rate the other side, see their rating of you -->
                    <div id="chat-rating" class="mb-2"></div>
                    <div id="chat-messages" class="chat-messages mb-2" aria-live="polite"></div>
                    <!-- Photos chosen for the next message (more pictures of the copy, when the buyer asks) -->
                    <div id="chosen-photos" class="chosen-photos d-flex flex-wrap align-items-center gap-1 mb-2 d-none"></div>
                    <form id="chat-form" class="d-flex gap-2">
                        <button type="button" id="attach-photos" class="btn btn-secondary align-self-end"
                                data-i18n-title="chat_attach_photos" data-i18n-aria-label="chat_attach_photos">📷</button>
                        <input type="file" id="chat-photos" accept="image/jpeg,image/png,image/webp" multiple hidden>
                        <textarea id="chat-input" rows="2" maxlength="2000" class="form-control"
                                  data-i18n-placeholder="message_placeholder" data-i18n-aria-label="message_placeholder"></textarea>
                        <button class="btn btn-primary align-self-end" data-i18n="send"></button>
                    </form>
                    <div id="chat-error" class="alert alert-danger d-none py-1 px-2 small mt-2" role="alert"></div>
                </div>
            </section>
            <p id="pick-chat" class="text-body-secondary d-none" data-i18n="pick_conversation"></p>
        </div>
    </div>
</div>

<script src="/static/pages/messages.js"></script>
</body>
</html>
