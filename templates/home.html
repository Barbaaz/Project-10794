<!DOCTYPE html>
<html lang="pt" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SaveOnGames</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <!-- installable on a phone (static/manifest.webmanifest, static/sw.js) -->
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2346d0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="/static/common.css" rel="stylesheet">
    <script src="/static/common.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/slider.js"></script>
    <style>
        /* The home page (user, 2026-10-15: the prototype's layout A): the most anticipated in the big slider, then a
           sideways row per list; one platform filter for all of them */
        .min-w-0 { min-width: 0; }
        .home-platforms { display: flex; gap: .5rem; overflow-x: auto; scrollbar-width: none; padding: 2px; margin-bottom: 1.25rem; }
        .home-platforms .chip-btn { flex-shrink: 0; white-space: nowrap; }
        #home-rows[aria-busy="true"] { opacity: .45; pointer-events: none; transition: opacity .15s; }
        .row-head { display: flex; align-items: baseline; gap: .75rem; margin-bottom: .6rem; }
        .row-head h2 { font-size: 1.25rem; font-weight: 800; margin: 0; }
        .row-head .see-all { margin-left: auto; font-size: .9rem; white-space: nowrap; }
        .row-sub { font-size: .85rem; color: var(--bs-secondary-color); }
        /* a card: cover (with the list's badge), platforms, name, the best price and its store */
        .home-card { display: block; color: inherit; text-decoration: none; min-width: 0; }
        .home-card .cover { position: relative; border-radius: .75rem; overflow: hidden; background: var(--bs-secondary-bg); }
        .home-card img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; transition: transform .3s ease; }
        .home-card img.store-photo { object-fit: contain; background: #fff; }
        .home-card:hover img { transform: scale(1.03); }
        @media (prefers-reduced-motion: reduce) { .home-card img { transition: none; } .home-card:hover img { transform: none; } }
        .home-card .plat { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--bs-primary);
                           margin-top: .5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .home-card .name { font-weight: 700; line-height: 1.25; height: 2.5em; overflow: hidden;
                           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .home-card:hover .name { text-decoration: underline; }
        .home-card .price { font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums; }
        .home-card .meta { font-size: .8rem; color: var(--bs-secondary-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .cover .tag { position: absolute; top: .45rem; left: .45rem; font-size: .75rem; font-weight: 800; border-radius: .4rem;
                      box-shadow: 0 1px 3px rgb(0 0 0 / .25); }
        .tag-save { background: #fff; color: #0f7a4a; }
        .tag-sale { background: var(--bs-danger); color: #fff; }
        .tag-low { background: #0f7a4a; color: #fff; }
        .tag-new { background: var(--bs-primary); color: #fff; }
        /* a row of cards as a slider (user, 2026-10-15: "like the rest"): the arrows in its title bar, always there, and
           the next card showing at the edge; it also scrolls by swipe / trackpad, snapping to a card */
        .rail { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 5 * 1rem) / 5.4); gap: 1rem;
                overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: .25rem; }
        .rail > * { scroll-snap-align: start; }
        @media (max-width: 991.98px) { .rail { grid-auto-columns: calc((100% - 3 * 1rem) / 3.4); } }
        @media (max-width: 575.98px) { .rail { grid-auto-columns: 42%; gap: .75rem; } }
        .rail-arrows { display: flex; gap: .35rem; }
        .rail-btn { width: 2.1rem; height: 2.1rem; border-radius: 50%; border: 1px solid var(--bs-border-color); padding: 0;
                    background: var(--bs-body-bg); color: var(--bs-body-color); font-size: 1.1rem; line-height: 1; }
        .rail-btn:hover:not(:disabled) { background: var(--bs-secondary-bg); }
        .rail-btn:disabled { opacity: .35; }
        .row-head { align-items: center; }
    </style>
</head>
<body class="bg-body-tertiary">
{% set landing = true %}
{% include "_header.html" %}
<main class="container-xxl pb-5">
    <!-- the sections (user, 2026-10-15: a way to the tabs, which moved to /browse) -->
    <nav class="tabs-band" data-i18n-aria-label="sections">
        <ul class="nav nav-pills front-tabs">
            <li class="nav-item"><a class="nav-link" href="/browse?tab=discounts" data-i18n="tab_discounts"></a></li>
            <li class="nav-item"><a class="nav-link" href="/browse?tab=preorders" data-i18n="tab_preorders"></a></li>
            <li class="nav-item"><a class="nav-link" href="/browse?tab=releases" data-i18n="tab_releases"></a></li>
            <li class="nav-item"><a class="nav-link" href="/browse?tab=catalog" data-i18n="tab_catalog"></a></li>
            <li class="nav-item"><a class="nav-link" href="/browse?tab=special" data-i18n="tab_special"></a></li>
            <li class="nav-item"><a class="nav-link" href="/browse?tab=hardware" data-i18n="tab_hardware"></a></li>
            <li class="nav-item"><a class="nav-link" href="/browse?tab=market" data-i18n="tab_market"></a></li>
        </ul>
    </nav>
    <div id="home-platforms" class="home-platforms" role="group" data-i18n-aria-label="platform"></div>
    <div id="home-slider"></div>
    <div id="home-rows"></div>
</main>
<script src="/static/pages/home.js"></script>
</body>
</html>
