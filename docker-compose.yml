# Try the site on any computer with Docker:   docker compose up --build   → http://localhost:5000
# Needs a .env file (copy .env.example). See "Try it with Docker" in README.md.
services:
  db:
    # PostgreSQL 18. Its data stays in the "pgdata" volume between runs ("dbdata" was SQL Server's:
    # PostgreSQL can't start on its files)
    image: postgres:18
    environment:
      POSTGRES_USER: project10794
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
      # The app's database is made by database/setup.py (with Portuguese sorting), not here
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql

  web:
    build: .
    depends_on:
      - db
    environment:
      DB_CONNECTION_STRING: "host=db port=5432 dbname=project10794 user=project10794 password=${DB_PASSWORD}"
      # Signs the login cookie; keep it secret and the same between restarts
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (copy .env.example)}
      # Optional: only needed to look up new games on IGDB (pipeline/igdb.py)
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      # 1 = a test copy on demo data (set by the teste/ launchers): banner on every page, demo users
      DEMO_MODE: ${DEMO_MODE:-}
      # Optional: /collection's Steam import
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      # Optional: e-mail (password reset). Without SMTP_HOST, e-mails are only written to the log
      SITE_URL: ${SITE_URL:-http://localhost:5000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      # WEB_PORT: the port on this computer (the teste/ launchers use 8010: macOS keeps 5000 for AirPlay)
      - "${WEB_PORT:-5000}:5000"
    volumes:
      # The demo data file, if you were given one (not in the repository)
      - ./database/demo:/app/database/demo:ro
      # Photos people upload to their listings, kept between restarts and rebuilds
      - uploads:/app/instance/uploads

volumes:
  pgdata:
  uploads:
